name: Validate catalog

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The build keeps each drawn link preview card here. npm ci empties node_modules, so this step comes after it.
      - id: og-cards
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/og-cards
          key: og-cards-${{ hashFiles('src/**', 'data/**', 'public/**', 'package-lock.json') }}
          restore-keys: og-cards-
      - run: npm run verify
      # A card that this run did not read or draw has stale input.
      - run: find node_modules/.cache/og-cards -type f -mmin +30 -delete
        if: steps.og-cards.outputs.cache-hit != 'true'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.og-cards.outputs.cache-hit != 'true'
        with:
          path: node_modules/.cache/og-cards
          key: ${{ steps.og-cards.outputs.cache-primary-key }}
