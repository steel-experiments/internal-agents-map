name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/archive_sources.py --check
      - run: uv run --locked python scripts/build.py --check
      - run: uv run --locked python scripts/check_private_data.py
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked python scripts/check_links.py --local
