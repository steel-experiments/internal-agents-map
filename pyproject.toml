[project]
name = "internal-agents-map"
version = "0.0.0"
description = "Source-backed catalog of internal AI agent implementations"
requires-python = ">=3.12"
dependencies = [
    "openai==3.18.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.2",
    "steel-sdk==0.19.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM"]
