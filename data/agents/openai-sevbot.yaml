# yaml-language-server: $schema=../agent.schema.json
id: openai-sevbot
company: OpenAI
agent_name: Sevbot
approach_type: agent
deployment_stage: deployed
year: 2026
first_public_evidence:
  date: "2025-11-20"
  source_id: crtsh-sevbot-certificates
last_reviewed_at: "2026-09-16"
status: internal
domains:
- on-call
autonomy: drafts-reviewed
relationships:
- type: component-of
  approach_id: openai-software-factory
operating_models:
- scope: "incident detected -> applied mitigation"
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  state: unknown
  identity: dedicated-agent
  evidence_strength: secondary-only
summary: OpenAI's internal incident-response agent, built on Codex. When an incident is detected, it collects
  context, proposes mitigations, and answers questions in the incident Slack channel. The report describes
  an engineer instructing it to apply a chosen mitigation.
architecture:
  sandbox: unknown
  harness: Built on top of Codex
  model: unknown
  interfaces:
  - slack
primitives:
- name: Propose-only mitigation
  desc: Proposes mitigations in the incident channel; an engineer can instruct it to apply a specific mitigation
- {name: Wake on a detected incident, desc: "When an incident is detected, the bot wakes up"}
- {name: Collect incident context, desc: Collects context about the incident}
- {name: Answer developers' questions, desc: Answers developers' questions as part of the incident Slack channel}
key_metrics: []
lessons_learned:
- OpenAI describes autonomous mitigation of routine outages as a goal for Sevbot; on-call duty still exists
  in the reported deployment.
sources:
- id: openai-sevbot-article
  title: "Inside OpenAI's agentic software factory"
  url: https://newsletter.pragmaticengineer.com/p/openai-software-factory
  canonical_url: https://newsletter.pragmaticengineer.com/p/openai-software-factory
  kind: news
  provenance_class: independent-secondary
  role: evidence
  publisher: The Pragmatic Engineer
  authors:
  - Gergely Orosz
  published_at: "2026-09-15"
  accessed_at: "2026-09-16"
  last_verified_at: "2026-09-16"
