evidence:
  summary:
  - source_id: openai-sevbot-article
    relation: supports
    locator: Preserved content.md, lines 183-195
  - source_id: crtsh-sevbot-certificates
    relation: supports
    locator: Preserved content.md, lines 13-41 (certificate table for sevbot.api.openai.com; earliest not-before
      2025-11-20 at lines 37-41, with renewals through 2026-08-01; evidences a deployed OpenAI service under
      the Sevbot name, not its incident-response behavior)
  - source_id: github-sevbot-pr
    relation: supports
    locator: Preserved content.md, lines 21-27 (initial commit '[SEVBot] Optionize initialized notification tolerance',
      219a67a, 2026-03-24, authored by an OpenAI employee and co-authored by Codex; evidences internal Sevbot-branded
      engineering work)
  operating_models.0:
  - source_id: openai-sevbot-article
    relation: supports
    locator: "Preserved content.md, lines 190-193 (determines possible mitigations but never executes any; an engineer can tell it to apply a specific mitigation)"
  architecture.sandbox:
  - source_id: openai-sevbot-article
    relation: supports
    locator: "Preserved content.md, lines 188-195 describe Sevbot without documenting an execution sandbox"
  architecture.harness:
  - source_id: openai-sevbot-article
    relation: supports
    locator: "Preserved content.md, line 188 (Sevbot is built on top of Codex)"
  architecture.model:
  - source_id: openai-sevbot-article
    relation: supports
    locator: "The preserved article names no underlying models for Sevbot"
  architecture.interfaces:
  - source_id: openai-sevbot-article
    relation: supports
    locator: "Preserved content.md, line 192 (it is part of the Slack channel and answers devs' questions)"
  primitives.0:
  - source_id: openai-sevbot-article
    relation: supports
    locator: Preserved content.md, lines 191-193
  primitives.1:
  - {source_id: openai-sevbot-article, relation: supports, locator: 'Preserved content.md, line 188'}
  primitives.2:
  - {source_id: openai-sevbot-article, relation: supports, locator: 'Preserved content.md, line 190'}
  primitives.3:
  - {source_id: openai-sevbot-article, relation: supports, locator: 'Preserved content.md, line 192'}
  lessons_learned.0:
  - source_id: openai-sevbot-article
    relation: supports
    locator: Preserved content.md, lines 195
claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The article says Sevbot proposes mitigations and that an engineer can tell it to apply one. This supports an engineer-controlled mitigation path; the source's 'never executes any' wording is read as a limit on autonomous execution."
    valid_at: "2026-09"
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The article does not document an execution sandbox; unknown does not mean absent."
  architecture.model:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The article names no underlying models; unknown does not mean absent."
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The source explicitly contrasts the hoped-for autonomous response with the continuing
      on-call requirement, so the goal must not read as current behavior.
    valid_at: 2026-09
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [openai-sevbot-article, crtsh-sevbot-certificates, github-sevbot-pr]
  workflow_scope: Detected incident to engineer-directed mitigation in the incident Slack channel
  questions:
    purpose: {state: reported, claim_paths: [summary]}
    workflow: {state: reported, claim_paths: [primitives.1, primitives.2, primitives.0, primitives.3], note: 'The
      article lists the run in order: wake, collect, propose, answer, and the engineer instruction. The
      propose-only primitive spans the proposal and the instruction the article states separately.'}
    human_involvement: {state: reported, claim_paths: [primitives.0, operating_models.0], note: 'The engineer-controlled
      mitigation instruction is the documented checkpoint; the article states Sevbot never executes a
      mitigation on its own.'}
    implementation: {state: reported, claim_paths: [architecture.harness, architecture.interfaces]}
    validation: {state: unreported, claim_paths: [], note: 'The article documents no check of Sevbot''s proposals
      or answers; the propose-only limit is a behavior boundary, not a validation mechanism.'}
    observations: {state: unreported, claim_paths: [], note: 'No outcome measurement for Sevbot appears in the
      reviewed captures. The certificate and commit records evidence a deployed service, not results.'}
    lessons: {state: reported, claim_paths: [lessons_learned.0]}
  implementation_fields:
    model: {state: unreported, claim_paths: [], note: 'The article names no underlying model for Sevbot; the legacy
      unknown placeholder stays in research details.'}
    harness: {state: reported, claim_paths: [architecture.harness]}
    sandbox: {state: unreported, claim_paths: [], note: 'The article describes no execution or isolation boundary;
      the legacy unknown placeholder stays in research details.'}
    tool_access: {state: unreported, claim_paths: []}
    knowledge: {state: unreported, claim_paths: [], note: 'No knowledge source is named for Sevbot; the article''s
      factory-wide Codex context access is not attributed to Sevbot.'}
    context_mgmt: {state: unreported, claim_paths: []}
    credentials: {state: unreported, claim_paths: []}
    interfaces: {state: reported, claim_paths: [architecture.interfaces]}
  primitive_roles: {primitives.0: workflow, primitives.1: workflow, primitives.2: workflow, primitives.3: workflow}
  observations: {}
