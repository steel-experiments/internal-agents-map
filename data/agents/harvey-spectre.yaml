claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The source explicitly frames diffs, branches, and pull requests as reviewable outputs.
    valid_at: '2026'
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The platform introduction and execution flow name reviewable artifacts and a human decision
      point when a run fails.
  lessons_learned.1:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The authors frame these as engineering challenges and describe a durable run as their response;
      they do not quantify a shift in review bottlenecks.
  lessons_learned.2:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The security article explains that sharing detection knowledge and investigation memory would
      expose information valuable to an attacker; this is Harvey's design rationale.
