# yaml-language-server: $schema=../agent.schema.json
id: ramp-inspect
company: Ramp
agent_name: Inspect
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: ramp-inspect-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
- code-review
- on-call
autonomy: drafts-reviewed
operating_models:
- scope: Inspect coding task → reviewed production merge
  attention_boundary: work-product-review
rubric:
  invocation:
  - background
  - interactive
  evidence_strength: mixed
summary: Inspect runs coding tasks in prepared remote environments at Ramp. It can run tests, read telemetry
  and feature flags, and inspect the frontend. Ramp also builds other agents on its platform, including agents
  that monitor production and propose fixes.
headline_metric: 75% of Ramp's merged PRs raised by Inspect sessions (May 2026)
architecture:
  sandbox: Modal sandboxes; per-repo images rebuilt every 30 min from snapshots; warm-on-keystroke; a pool of warm
    sandboxes
  harness: OpenCode (server-first) as the agent runtime; a plugin blocks writes until sync completes; expanded into
    production monitoring and self-maintenance; Inspect itself is built with React/Vite, Cloudflare Durable Objects,
    SQLite, and the Cloudflare Agents SDK
  model: All frontier models, MCPs, custom tools, skills
  interfaces:
  - slack
  - web
  - chrome-extension
  - github
  tool_access: Wired into Sentry, Datadog, LaunchDarkly, Braintrust, GitHub, Slack, Buildkite; monitors production,
    triages issues, proposes fixes; debugging queries a sanitized read-only production DB replica and Snowflake
  knowledge: Skills that encode how Ramp ships; repo images with the full dev env (Vite, Postgres, Redis, RabbitMQ,
    Temporal, Chromium, VS Code Server)
  context_mgmt: Sandbox snapshots persist session state for follow-ups, and every client change syncs to the session
  credentials: GitHub auth per user; the sandbox pushes the branch, an API opens the PR with the user's token (no
    self-approval); production merges retain human review
primitives:
- id: modal-sandbox-snapshots
  name: Modal sandbox + snapshots
  desc: Repository images and snapshots prepare dependencies and build state before sessions start
  role: mechanism
- id: opencode-runtime
  name: OpenCode runtime
  desc: OpenCode runs as a server with a typed SDK and plugin interfaces
  role: mechanism
- id: multiplayer-sessions
  name: Multiplayer sessions
  desc: Any number of people in one session; each change attributed to its author
  role: mechanism
- {id: fix-bug-slack-thread, name: Fix a bug from a Slack thread, desc: 'An @inspect mention in Slack reads the thread context, works in its
    sandbox, and raises a pull request with the fix', role: workflow}
- {id: verify-its-own-changes, name: Verify its own changes, desc: 'Inspect runs tests, reviews telemetry and feature flags for backend changes,
    and visually verifies frontend changes with screenshots and live previews', role: validation}
key_metrics:
- id: prs-authored-inspect-january
  text: Around 60% of Ramp PRs authored by Inspect by January 2026
- id: merged-prs-raised-inspect-sessions-may
  text: 75% of merged PRs raised by Inspect sessions (May 2026)
- id: merged-frontend-backend-prs-earlier-first
  text: Around 30% of merged frontend and backend PRs in the earlier first-party report, after a couple of months of adoption
- id: inspect-repo-prs-from-inspect
  text: Around 90% of PRs merged into the Inspect repository come from Inspect sessions in the later interview report
- id: one-million-total-inspect-sessions-crossed
  text: One million total Inspect sessions crossed in July 2026
- id: seconds-spin-fully-provisioned-remote-dev
  text: Under 5 seconds to spin up a fully provisioned remote dev environment
- id: underpins-internal-agents-including-reviewbuddy-oncall
  text: Inspect underpins internal agents including ReviewBuddy, Oncall Assistant, Testo, Ramp Research, Voice of the
    Customer, and error automations
- id: engineers-contributed-inspect-codebase-later-interview
  text: 150+ engineers contributed to the Inspect codebase in the later interview report
- id: inspect-team-size
  text: 5.5-person Inspect team (four engineers, a director, and a part-time PM)
- id: inspect-written-in-inspect
  text: More than 80% of Inspect is written in Inspect sessions
- id: session-speed-design-goal
  text: 'Design goal: session speed should be limited only by model-provider time-to-first-token'
lessons_learned:
- id: argues-controlling-internal-tool-lets-tailor
  text: Ramp argues that controlling an internal tool lets it tailor the system to its own codebase.
- id: credits-visible-use-shared-channels-helping
  text: Ramp credits visible use in shared channels with helping Inspect spread without a usage mandate.
- id: values-remote-agent-sessions-concurrent-work
  text: Ramp values remote agent sessions for concurrent work without tying up a developer's laptop.
- id: builds-repository-images-ahead-request-synchronizes
  text: Ramp builds repository images ahead of a request, then synchronizes recent code when a session starts.
- id: adoption-grew-ramp-changed-chrome-extension
  text: Inspect adoption grew after Ramp changed it from a Chrome extension into a centrally configured remote development
    environment.
