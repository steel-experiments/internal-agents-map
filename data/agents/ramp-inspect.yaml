summary: A background coding agent that closes the loop on verifying its own work; runs tests, reviews telemetry,
  queries feature flags, visually verifies the frontend; now also monitoring production and proposing fixes; also
  a platform that hosts many internal agents.
headline_metric: 75% of Ramp's merged PRs raised by Inspect sessions (May 2026)
architecture:
  sandbox: Modal sandboxes; per-repo images rebuilt every 30 min from snapshots; warm-on-keystroke; a pool of warm
    sandboxes
  harness: OpenCode (server-first) as the agent runtime; a plugin blocks writes until sync completes; expanded into
    production monitoring and self-maintenance; Inspect itself is built with React/Vite, Cloudflare Durable Objects,
    SQLite, and the Cloudflare Agents SDK
  model: All frontier models, MCPs, custom tools, skills
  interfaces:
  - slack
  - web
  - chrome-extension
  - github
  tool_access: Wired into Sentry, Datadog, LaunchDarkly, Braintrust, GitHub, Slack, Buildkite; monitors production,
    triages issues, proposes fixes; debugging queries a sanitized read-only production DB replica and Snowflake
  knowledge: Skills that encode how Ramp ships; repo images with the full dev env (Vite, Postgres, Redis, RabbitMQ,
    Temporal, Chromium, VS Code Server)
  credentials: GitHub auth per user; the sandbox pushes the branch, an API opens the PR with the user's token (no
    self-approval); production merges retain human review
primitives:
- name: Modal sandbox + snapshots
  desc: Pre-warmed full dev envs; fast cold start; effectively free to run
- name: OpenCode runtime
  desc: Server-first agent with a typed SDK + plugin system; code is its own source of truth
- name: Multiplayer sessions
  desc: Any number of people in one session; each change attributed to its author
key_metrics:
- Around 60% of Ramp PRs authored by Inspect by January 2026
- 75% of merged PRs raised by Inspect sessions (May 2026)
- Around 30% of merged frontend and backend PRs in the earlier first-party report, after a couple of months of adoption
- Around 90% of PRs merged into the Inspect repository come from Inspect sessions in the later interview report
- One million total Inspect sessions crossed in July 2026
- Under 5 seconds to spin up a fully provisioned remote dev environment
- Inspect underpins internal agents including ReviewBuddy, Oncall Assistant, Testo, Ramp Research, Voice of the
  Customer, and error automations
- 150+ engineers contributed to the Inspect codebase in the later interview report
- 5.5-person Inspect team (four engineers, a director, and a part-time PM)
- More than 80% of Inspect is written in Inspect sessions
- 'Design goal: session speed should be limited only by model-provider time-to-first-token'
lessons_learned:
- Own the tooling; it only has to work on your code, which lets you build something more powerful than off-the-shelf
- Work in public spaces to create virality loops; let the product do the talking, don't mandate
- Ramp argues that a fast background agent can add remote resources and concurrency to the same model
- Move as much as possible into the image-build step so users never wait on setup
- The v1 Chrome extension saw little adoption; the pivot to a centrally configured remote dev environment with a
  coding agent on top drove adoption
