claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The source explicitly states that Inspect cannot self-approve and production merges retain
      human review.
    valid_at: 2026-05
  lessons_learned.argues-controlling-internal-tool-lets-tailor:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The author gives codebase specificity as a reason to build Inspect; the post does not
      establish superiority over every available external tool.
  lessons_learned.credits-visible-use-shared-channels-helping:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The adoption account reports the absence of a mandate and the use of public work; it does
      not separate visibility from improvements in the product.
  lessons_learned.values-remote-agent-sessions-concurrent-work:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The article describes simultaneous sessions and calls background operation better for
      this use. It does not supply a general local-versus-remote benchmark.
  lessons_learned.builds-repository-images-ahead-request-synchronizes:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The image process includes cloning, dependencies, setup, and snapshots on a 30-minute
      cadence. A final synchronization remains, so setup is not literally eliminated.
  lessons_learned.adoption-grew-ramp-changed-chrome-extension:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective reports the November 2025 pivot and subsequent usage. It does not isolate
      which part of the change caused the increase.
  headline_metric:
    metric_scope: Ramp merged PRs raised by Inspect sessions by May 2026
    valid_at: 2026-05
    denominator: Merged Ramp pull requests
    category: adoption-output
    basis: reported-measurement
    subject: 'Ramp merged PRs raised by
      Inspect sessions by May 2026'
  key_metrics.merged-prs-raised-inspect-sessions-may:
    metric_scope: Ramp merged PRs raised by Inspect sessions by May 2026
    valid_at: 2026-05
    denominator: Merged Ramp pull requests
  key_metrics.prs-authored-inspect-january:
    metric_scope: Ramp PRs authored by Inspect by January 2026
    valid_at: 2026-01
    denominator: Ramp pull requests in the source adoption history
    category: adoption-output
    basis: reported-measurement
    subject: 'Ramp PRs authored by Inspect in
      the adoption history through January 2026'
  key_metrics.merged-frontend-backend-prs-earlier-first:
    metric_scope: Merged PRs in Ramp frontend and backend repositories after the first couple of months of adoption
    denominator: Merged PRs in frontend and backend repositories
    category: adoption-output
    basis: reported-measurement
    subject: 'Merged PRs in Ramp frontend and
      backend repositories in the earlier first-party report'
  key_metrics.inspect-repo-prs-from-inspect:
    metric_scope: PRs merged into the Inspect repository
    denominator: Merged PRs in the Inspect repository
    category: adoption-output
    basis: reported-measurement
    subject: 'PRs merged into the Inspect
      repository itself, as distinct from all Ramp PRs'
  key_metrics.one-million-total-inspect-sessions-crossed:
    metric_scope: Cumulative Inspect sessions crossing the million mark in July 2026
    valid_at: 2026-07
    category: adoption-output
    basis: reported-measurement
    subject: 'Cumulative Inspect sessions
      since launch, crossing one million in July 2026'
  key_metrics.seconds-spin-fully-provisioned-remote-dev:
    metric_scope: Provisioning a fully configured remote development environment
    category: cost-latency
    basis: reported-measurement
    subject: 'Spin-up time of a fully
      provisioned remote development environment'
  key_metrics.underpins-internal-agents-including-reviewbuddy-oncall:
    metric_scope: Examples of internal agents built on Inspect
    kind: fact
    category: implementation-scale
    basis: qualitative
    subject: 'Named internal agents built on the
      Inspect platform, from ReviewBuddy to error automations'
  key_metrics.engineers-contributed-inspect-codebase-later-interview:
    metric_scope: Engineers who contributed to the Inspect codebase in the later interview report
    category: implementation-scale
    basis: reported-measurement
    subject: 'Engineers who contributed
      to the Inspect codebase'
  key_metrics.inspect-team-size:
    metric_scope: 'Inspect team staffing: four engineers, one director, and a part-time PM'
    category: implementation-scale
    basis: reported-measurement
    subject: 'Inspect team staffing of
      four engineers, a director, and a part-time PM'
  key_metrics.inspect-written-in-inspect:
    metric_scope: Inspect code written in Inspect sessions; distinct from merged PR share
    denominator: Inspect code; the source does not define a code-volume counting method
    category: implementation-scale
    basis: reported-measurement
    subject: 'Share of the Inspect
      codebase written in Inspect sessions'
  key_metrics.session-speed-design-goal:
    metric_scope: Target session startup speed, excluding precompleted cloning and installation
    kind: opinion
    confidence: medium
    confidence_reason: The source says session speed should only be limited by model time-to-first-token; this is
      a design goal, not a measured result.
    category: cost-latency
    basis: target
    subject: 'Session startup speed relative to
      model-provider time-to-first-token'
