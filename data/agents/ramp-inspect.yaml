claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The source explicitly states that Inspect cannot self-approve and production merges retain
      human review.
    valid_at: 2026-05
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The author gives codebase specificity as a reason to build Inspect; the post does not
      establish superiority over every available external tool.
  lessons_learned.1:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The adoption account reports the absence of a mandate and the use of public work; it does
      not separate visibility from improvements in the product.
  lessons_learned.2:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The article describes simultaneous sessions and calls background operation better for
      this use. It does not supply a general local-versus-remote benchmark.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The image process includes cloning, dependencies, setup, and snapshots on a 30-minute
      cadence. A final synchronization remains, so setup is not literally eliminated.
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective reports the November 2025 pivot and subsequent usage. It does not isolate
      which part of the change caused the increase.
  headline_metric:
    metric_scope: Ramp merged PRs raised by Inspect sessions by May 2026
    valid_at: 2026-05
    denominator: Merged Ramp pull requests
  key_metrics.1:
    metric_scope: Ramp merged PRs raised by Inspect sessions by May 2026
    valid_at: 2026-05
    denominator: Merged Ramp pull requests
  key_metrics.0:
    metric_scope: Ramp PRs authored by Inspect by January 2026
    valid_at: 2026-01
    denominator: Ramp pull requests in the source adoption history
  key_metrics.2:
    metric_scope: Merged PRs in Ramp frontend and backend repositories after the first couple of months of adoption
    denominator: Merged PRs in frontend and backend repositories
  key_metrics.3:
    metric_scope: PRs merged into the Inspect repository
    denominator: Merged PRs in the Inspect repository
  key_metrics.4:
    metric_scope: Cumulative Inspect sessions crossing the million mark in July 2026
    valid_at: 2026-07
  key_metrics.5:
    metric_scope: Provisioning a fully configured remote development environment
  key_metrics.6:
    metric_scope: Examples of internal agents built on Inspect
    kind: fact
  key_metrics.7:
    metric_scope: Engineers who contributed to the Inspect codebase in the later interview report
  key_metrics.8:
    metric_scope: 'Inspect team staffing: four engineers, one director, and a part-time PM'
  key_metrics.9:
    metric_scope: Inspect code written in Inspect sessions; distinct from merged PR share
    denominator: Inspect code; the source does not define a code-volume counting method
  key_metrics.10:
    metric_scope: Target session startup speed, excluding precompleted cloning and installation
    kind: opinion
    confidence: medium
    confidence_reason: The source says session speed should only be limited by model time-to-first-token; this is
      a design goal, not a measured result.
