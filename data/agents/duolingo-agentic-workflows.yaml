summary: Duolingo built shared infrastructure that turns a tested prompt into an internal tool. A JSON form defines
  a coding-agent workflow against one repository, Temporal runs the workflows that need several steps, and a shared
  library wraps the Codex CLI and the Claude Code SDK.
architecture:
  sandbox: unknown
  harness: Temporal runs the workflows; a shared CodingAgent library wraps the Codex CLI and the Claude Code SDK
    behind one interface.
  interfaces:
  - internal-ui
  - slack
  - github
  tool_access: Workflows clone repositories and open pull requests through a shared GitHub utility package. Prototype
    agents use the GitHub MCP server, and an Atlassian server is named as planned work.
  credentials: Coding-agent API keys are set as environment variables, and a shared GitHub App token makes every
    pull request come from a bot account with centrally controlled permissions.
primitives:
- name: Fill out the workflow form
  desc: A Duo describes the workflow in a simple JSON form that carries a prompt, a code repository, and zero or
    more parameters for sharing and reuse.
- name: Test the prompt
  desc: Duos craft the prompt in Codex or Claude until they judge it successful and check that it works in a variety
    of situations, then stage the workflow for end-to-end testing.
- name: Publish to the internal tool list
  desc: A merged form appears automatically in a list of internal tools that any Duo can run, and Slack notifications
    report the progress of a run.
- name: Run the common pattern
  desc: The shared pattern clones the repository, lets the coding agent make the code change, then commits the code
    and optionally opens a pull request.
- name: CodingAgent library
  desc: One library wraps the Codex CLI and the Claude Code SDK; a call gives a prompt and a working directory,
    and an enum parameter usually selects which agent runs.
- name: GitHub utility package
  desc: A shared package holds the common repository interactions, such as cloning a repository and opening a pull
    request, and is used by all of the agents.
- name: Multi-step Temporal workflows
  desc: A custom workflow gives each step a single retryable activity with its own timeout and retry policy, so
    that long-running work survives a failed step.
key_metrics:
- Duolingo says a Duo can create a workflow that follows the common pattern in under five minutes; the post states
  this as a section heading and a TL;DR claim, with no measurement method
- Duolingo reports an average of 1-2 days to create a custom Temporal workflow by running BootstrapTemporalWorkflow
  and copying an existing workflow; no period, denominator, or method is reported
lessons_learned:
- Duolingo found one pattern recurring across its coding agents (clone the repository, make the change, commit and
  optionally open a pull request) and built its no-code workflow form around that pattern.
- Duolingo splits a multi-step agent workflow into single retryable activities with their own timeouts and retry
  policies, so that AI non-determinism does not restart the whole process.
- Duolingo routes the pull requests of all its agents through a shared GitHub App token, so that they come from
  one bot account with centrally controlled permissions.
- Duolingo reports that running Docker inside Docker on Temporal blocks a set of planned agent features, and says
  the issue is being actively addressed.
- The authors describe agentic workflows at Duolingo as early days and call both the capabilities and the supporting
  infrastructure open questions.
