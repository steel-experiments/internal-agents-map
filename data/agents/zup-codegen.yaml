summary: CodeGen is Zup's internal coding agent. In the preserved paper abstract, its authors attribute reliability
  improvements to editing tools and layered controls, and adoption to progressive human oversight. The abstract
  provides no measurements or definitions of those oversight modes.
architecture:
  harness: Constrained editing tools; state-management concerns; progressive levels of human oversight
  model: Not specified (see paper)
  tool_access: Constrained editing tools rather than free-form code generation
  credentials: Layered safety controls
primitives:
- name: Constrained editing tools
  desc: String-replacement edits instead of full-file rewrites, combined with layered safety controls
- name: Progressive oversight
  desc: Progressive oversight modes reported by the authors; the preserved abstract does not define the boundaries
lessons_learned:
- Zup's authors report larger reliability gains from targeted editing tools and layered controls than from
  prompt changes in CodeGen.
- Zup's authors attribute organic adoption partly to progressive human oversight modes.
