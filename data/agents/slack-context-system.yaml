claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The operational service returns reports to on-call staff; the example issue is referred to
      its owning team to resolve. No autonomous remediation is established.
    valid_at: '2025-12-01'
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The context article enumerates the three channels and explicitly says no other message history
      is passed forward.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The review-tools section describes both responsibilities and the Critic's access to evidence.
      The Critic is still a model and can make errors.
  lessons_learned.2:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The source describes what is passed between invocations, without documenting a durable session
      or recovery protocol; the state rubric therefore remains unknown.
  headline_metric:
    metric_scope: Complex security investigations requiring tailored multi-agent context; qualitative workload scale
  key_metrics.0:
    metric_scope: Complex security investigations requiring tailored multi-agent context; qualitative workload scale
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Slack reported the score distribution from its own review pipeline without independent verification
      or a stated measurement window.
    valid_at: '2026'
    metric_scope: Critic credibility scores of Expert findings across all reviewed investigations
