summary: Plaid's central internal Model Context Protocol server. Plaid built it because third-party MCP
  servers could not reach its internal data. The server integrates more than 20 tools and several internal
  services such as Jira, application logs, and data schemas, behind Plaid's identity-aware proxy and
  centralized authorization. Plaid reports that more than 80% of its engineers use AI clients connected to
  it, with thousands of tool calls and dozens of agents built on it.
