      explicit human approval; humans also review each PM-generated issue before implementation starts.
    valid_at: '2026-05-06'
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The runtime discussion names WorkOS's missing development infrastructure and required controls,
      then identifies the chosen provider and proxy design.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The orchestration section explicitly locates lifecycle and routing logic outside the execution
      environment.
  lessons_learned.2:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The architecture post supports modular components and the showcase names a different engine,
      but neither describes a complete before-and-after migration.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The feedback-loop section describes log-driven fixes and explicitly limits the degree of
      automatic task creation; it does not measure continual reliability gains.
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The architecture post describes this tuning directly. The showcase source previously attached
      to this lesson does not contain that account.
