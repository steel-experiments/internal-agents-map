summary: Horizon takes requests and external events into remote coding sessions, connects them to company context
  through MCP, and returns changes for human review. Its orchestrator manages sandbox lifecycle and routes results
  back to Slack, Linear, GitHub, or the web UI.
architecture:
  sandbox: Cloudflare Containers + Sandbox SDK; disposable, tightly scoped sandboxes with explicit lifecycle APIs
    and egress controls; full monorepo stack in Docker dev containers
  harness: Modular by design; the core article runs OpenCode in the sandbox; the Applied AI Showcase runs Claude
    Remote Routines. The harness is swappable as agent tech changes; separate PM, implementation, and prospective
    verification/security roles
  model: Not documented by name; the harness is the swappable layer (OpenCode in the core article, Claude Remote
    Routines in the showcase), and no source names the underlying model
  interfaces:
  - linear
  - github
  - slack
  - web
  tool_access: A custom MCP server stitches internal data sources (Datadog, Sentry, Slack, WorkOS Pipes); all outbound
    traffic proxied through Workers with allowlists, limits, logging, and token injection
  knowledge: AGENTS.md and CLAUDE.md capture scripts, docs, conventions; MCP codifies the patterns engineers already
    follow; Notion + Figma for specs/mockups
  credentials: WorkOS Pipes (no OAuth/token-refresh to maintain); scoped short-lived GitHub tokens per user; engineers
    use their own identity in the MCP; least-privilege + egress controls
  context_mgmt: The orchestrator pauses/resumes sandboxes and tracks state + artifacts across a run
primitives:
- name: Sandbox = execution primitive vs orchestrator = control plane
  desc: An orchestrator outside the sandbox manages requests, lifecycle, and returned artifacts
- name: Purpose-built agent infra
  desc: Cloudflare sandbox infrastructure with programmatic lifecycle APIs and an outbound proxy for egress controls
- name: Self-improvement loop
  desc: Session logs can lead to proposed fixes, scripts, or context updates; many platform tasks are still seeded
    manually
- name: MCP as an iterative product
  desc: WorkOS revises tool names and schemas to address repeated exploration and mistaken tool use
- name: Divide the project into issues
  desc: The PM agent splits a delegated Linear project into individual issues with descriptions and dependency ordering;
    a human reviews each issue before implementation starts
- name: Run the implementation session in the sandbox
  desc: When an issue moves to In Progress, the orchestrator assigns it to a cloud agent that boots the Docker development
    container with OpenCode and the custom MCP context server
- name: Hand off the pull request for human review
  desc: The run ends as a pull request attributed to the issue owner; no code merges without explicit human approval
- name: Continue the dependency chain after merge
  desc: The GitHub merge webhook marks the Linear issues done and starts the next eligible run on newly unblocked
    issues
- name: Verify the work inside the sandbox
  desc: The run lints, builds, and runs automated tests, and does initial validation of acceptance criteria, before
    requesting human attention
lessons_learned:
- WorkOS chose Cloudflare sandbox infrastructure for programmatic lifecycle control and an outbound proxy that enforces
  its egress policy.
- Horizon's orchestrator runs outside disposable sandboxes and manages incoming work, sandbox lifecycle, and returned
  artifacts.
- WorkOS describes OpenCode in one Horizon deployment and Claude Remote Routines in another; the accounts do not
  establish a migration of the whole platform.
- Horizon turns run friction into proposed platform fixes, while WorkOS still seeds many improvement tasks manually
  and retains human review.
- WorkOS revises MCP tool names, schemas, and conventions after observing agents repeat expensive exploration and
  wrong turns.
