claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The run anatomy ends at a pull request presented for human review, and the article states
      the pull request follows the same review and approval process as any other change. Approval pauses during
      the run are described as conditional, so attention normally returns at the work product.
    valid_at: '2026-07'
  operating_models.1:
    kind: inference
    provenance: catalog-judgment
    confidence: unverified
    confidence_reason: The article lists non-coding uses such as Jira triage, A/B experiment checks, data
      analysis, and document summaries, but does not say who reviews those outputs or when.
    valid_at: '2026-07'
  headline_metric:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap states the weekly volume in its own engineering blog without a denominator, a counting
      window, or a measurement method.
    valid_at: '2026-07'
    reported_by: Snap
    metric_scope: Mergeable pull requests Casper produces each week across Snap's engineering organization
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap reports a rounded count of custom agents and names the roles they cover, but dates the
      period only as "Since GA last quarter" and gives no measurement method.
    valid_at: '2026-07'
    reported_by: Snap
    metric_scope: Custom Casper agents created by Snap teams since general availability
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: The article reports the hours-against-weeks comparison as instances it has seen, without a
      sample size, a date, or a description of the earlier from-scratch attempt.
    valid_at: '2026-07'
    reported_by: Snap
    metric_scope: Build time for a custom on-call agent in Casper compared with an earlier from-scratch attempt
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The architecture section states the split directly, naming the four controller operations
      and the per-call authorization against the session identity. It describes Snap's design, not a verified
      security property.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The MCP Gateway section states that identity travels the whole chain and that each
      downstream system enforces the triggering user's existing permissions. The enforcement is described, not
      independently tested.
  lessons_learned.2:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: Snap states this target for its own program in one sentence; the article does not report
      how mergeability is counted, and the preference is Snap's rather than general advice.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Snap lists the five requirements vendor solutions did not meet for its codebase. The
      article names no vendor or evaluation, so only Snap's account of its own decision is supported.
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The template dimensions and the reported hundreds of custom agents support the practice.
      That templates are what makes Casper scale is Snap's framing, and the article reports no comparison against
      a single general-purpose agent.
