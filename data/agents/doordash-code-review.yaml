status: internal
domains:
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: pull request → AI review comments
  attention_boundary: work-product-review
rubric:
  invocation:
  - background
  - event-driven
  state: unknown
  identity: unknown
  evidence_strength: detailed-primary
summary: A specialized agent that automatically reviews 10,000+ PRs a week across 56 repositories, emphasizing grounded
  high-confidence findings over noisy comments.
headline_metric: 10,000+ pull requests reviewed per week across 56 repositories
architecture:
  harness: Three architecture versions; emphasis on attention and grounded, high-confidence findings rather than
    commenting everywhere
  model: Not specified
  interfaces:
  - github
  tool_access: Reviews Go, iOS, Android, web, infrastructure, and data code
  knowledge: Grounded findings tied to evidence
primitives:
- name: Grounded findings
  desc: Filters review candidates for evidence, confidence, and an actionable file-and-line location
- {name: Automatic review trigger, desc: Opening a pull request can automatically start the review alongside human reviewers}
- {name: Lead scout, desc: A scout reads the diff and produces focused investigation leads without trying to verify them}
- {name: Deep reviewers, desc: Two reviewers investigate the scout's leads and drop the ones that do not hold up}
- {name: Disprove-it pass, desc: Before publication the system tries to falsify each candidate finding and drops claims that do not survive}
- {name: Optional fixer, desc: "A person can tag the agent on a review comment; a remote VM applies the requested change and pushes a reviewable commit to the pull request"}
- {name: Evaluation loop, desc: Changes are tested on real past review misses and high-severity incidents before production acceptance data is checked}
key_metrics:
- 10,000+ PRs reviewed in a typical week across 56 repositories
- 60.2% action rate on settled high/critical findings (measured sample)
- Roughly $3 average cost per review
- Findings posted about 7 minutes after a pull request opens on average
lessons_learned:
- DoorDash favors fewer actionable review comments, accepting that this policy will miss some issues.
- DoorDash's reported acceptance rate describes how engineers use published findings; it cannot count issues
  the reviewer missed.
