summary: Salesforce was 'customer zero' for the rebuilt Slackbot; an employee agent that finds company context,
  drafts work, and connects Slack context with Salesforce data; now also an external product.
architecture:
  harness: An employee agent intended as a front door to other agents
  model: Not specified
  interfaces:
  - slack
  tool_access: Finds company context, drafts work, manages meetings, connects Slack context with Salesforce data
  knowledge: Slack context joined with Salesforce CRM data
  credentials: Permission-aware by construction; sees what the employee can see, respects roles and access controls
primitives:
- name: Permission-aware context
  desc: Agent visibility is bounded by the invoking employee's permissions
lessons_learned:
- Dogfood internally first ('customer zero') before shipping externally
- Make permission-awareness a construction property, not a prompt instruction; the agent sees only what the employee
  can see
