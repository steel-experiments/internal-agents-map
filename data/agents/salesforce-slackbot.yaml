# yaml-language-server: $schema=../agent.schema.json
id: salesforce-slackbot
company: Salesforce
agent_name: Slackbot
approach_type: agent
deployment_stage: scaled
year: 2025
first_public_evidence:
  date: '2025-12-01'
  source_id: salesforce-slackbot-source-2
last_reviewed_at: '2026-09-16'
status: commercialized
domains:
- support
- customer-success
- ops
autonomy: drafts-reviewed
operating_models:
- scope: 'employee request → drafted work'
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  state: unknown
  identity: unknown
  evidence_strength: detailed-primary
summary: Salesforce was 'customer zero' for the rebuilt Slackbot; an employee agent that finds company context,
  drafts work, and connects Slack context with Salesforce data; now also an external product.
architecture:
  harness: An employee agent intended as a front door to other agents
  model: Anthropic Claude (named via VentureBeat); additional providers planned within the year, with Google Gemini
    named and OpenAI possible
  interfaces:
  - slack
  tool_access: Finds company context, drafts work, manages meetings, connects Slack context with Salesforce data
  knowledge: Slack context joined with Salesforce CRM data
  credentials: Permission-aware by construction; sees what the employee can see, respects roles and access controls
primitives:
- name: Permission-aware context
  desc: Agent visibility is bounded by the invoking employee's permissions
- {name: Prepare a customer-meeting briefing, desc: 'Pulls recent discussions, relevant documents, and customer
    history into a single, clear briefing before a critical customer conversation'}
- {name: Turn scattered analysis into a shared Canvas, desc: 'In a documented demonstration, it correlated pilot
    feedback with an uploaded dashboard image, queried Salesforce for candidate accounts, and wrote the plan
    into a shared Canvas'}
key_metrics:
- Two-thirds of Salesforce's roughly 80,000 employees tried the new Slackbot, and 80% of those users continued
  using it regularly
- Internal satisfaction reached 96%, and employees report saving between two and 20 hours per week
lessons_learned:
- Salesforce used Slackbot internally before its phased customer rollout and describes itself as customer zero.
- Salesforce says Slackbot uses Slack roles and access permissions to limit the information it surfaces.
