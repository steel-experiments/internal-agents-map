summary: A GitHub-label-triggered PR approval agent that applies fail-closed deterministic safety gates, asks an LLM
  to check for showstoppers, autonomously approves eligible changes, and refuses or escalates the rest.
headline_metric: Handled 1,600 PRs in the month before July 9, 2026; roughly one in three merged main-repository PRs
  received its final approval during the reported quarter
architecture:
  harness: A GitHub Action invokes a Python pipeline that fetches and classifies a PR, applies hard gates, waits for
    in-flight reviewer bots, runs an LLM review, and posts a verdict
  model: Claude through the Claude Agent SDK, with Read, Grep, and Glob tools
  interfaces:
  - github
  - ci
  tool_access: Reads the diff and repository files plus trusted review-state, discussion, ownership, and reviewer signals
  knowledge: Repository-specific deny categories, size and risk tiers calibrated from prior human approvals, review
    guidance, and ownership data
  credentials: A dedicated Anthropic organization secret and a StampHog GitHub App token whose approvals satisfy
    branch protection
  context_mgmt: Each run emits a versioned JSON evidence bundle retained as a CI artifact for 30 days; a sticky GitHub
    comment carries non-approval verdict history and labels preserve retry state
primitives:
- name: Authoritative safety gates
  desc: Draft state, conflicts, requested changes, sensitive paths, size ceilings, and risk tiers can block AI approval;
    the LLM may tighten but never loosen a gate
- name: Risk-aware routing
  desc: Eligible changes can be approved while risky, ambiguous, or insufficiently assured changes are refused or
    escalated to a suitable human reviewer
- name: Auditable verdict bundle
  desc: Each run records PR metadata, classification, gate results, reviewer output, and the final verdict
key_metrics:
- 1,600 PRs handled autonomously in the month before July 9, 2026
- Roughly one in three PRs merged into PostHog's main repository received StampHog's final approval during the reported
  quarter
- 20% of PRs approved by StampHog in the July 28, 2026 report, at approximately $300 per month in tokens
lessons_learned:
- Use deterministic controls for known risks and allow the LLM to make approval stricter, never more permissive
- Calibrate thresholds and deny categories from repository history rather than treating small diffs as inherently safe
- Fail closed and preserve retry state when dependencies, credentials, or concurrent reviewer bots are unavailable
