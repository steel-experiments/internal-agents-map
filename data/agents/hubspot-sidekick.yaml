summary: HubSpot's internal AI code-review agent. Sidekick reviews every pull request. A multi-model Judge
  Agent checks each comment for accuracy and action before it posts. Sidekick runs on Aviator, a Java agent
  framework HubSpot built for precise tool control, which runs on Crucible, a self-hosted platform that runs
  agents in isolated containers that mirror a real developer environment.
headline_metric: Reviews every pull request and cut engineer feedback time by 90%
