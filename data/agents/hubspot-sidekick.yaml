page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids: [hubspot-sidekick-source-1, hubspot-sidekick-source-2]
  workflow_scope: Pull request opened → Sidekick draft review → judge-gated comments posted to GitHub
  questions:
    purpose: {state: reported, claim_paths: [summary]}
    workflow: {state: reported, claim_paths: [primitives.0, primitives.1, primitives.3]}
    human_involvement: {state: unreported, claim_paths: [], note: 'The review flow is automated end to end. The
      captures document post-hoc emoji and thread feedback on comments (source 1, lines 103–108) and continued human
      review for system design and architecture (line 12), but no required human checkpoint inside the review flow.'}
    implementation: {state: reported, claim_paths: [architecture.harness, architecture.tool_access, architecture.knowledge,
      architecture.interfaces]}
    validation: {state: reported, claim_paths: [primitives.2]}
    observations: {state: reported, claim_paths: [headline_metric, key_metrics.0, key_metrics.1, key_metrics.2]}
    lessons: {state: reported, claim_paths: [lessons_learned.0]}
  implementation_fields:
    model: {state: unreported, claim_paths: [], note: 'No capture states which model the review runs on. Multi-model
      support (Claude, GPT, Gemini) is a capability of the Aviator framework (source 1, line 45), not a statement
      about this reviewer.'}
    harness: {state: reported, claim_paths: [architecture.harness]}
    sandbox: {state: unreported, claim_paths: [], note: 'Execution isolation of the Aviator runtime is not documented.
      The Kubernetes sandboxing described in source 2 (lines 30–37) covers the earlier Crucible implementation.'}
    tool_access: {state: reported, claim_paths: [architecture.tool_access]}
    knowledge: {state: reported, claim_paths: [architecture.knowledge]}
    context_mgmt: {state: unreported, claim_paths: [], note: 'The captures describe no mechanism that maintains or
      organizes context for the reviewer over time.'}
    credentials: {state: unreported, claim_paths: []}
    interfaces: {state: reported, claim_paths: [architecture.interfaces]}
  primitive_roles: {primitives.0: workflow, primitives.1: workflow, primitives.2: validation, primitives.3: workflow}
  observations:
