id: hubspot-sidekick
company: HubSpot
agent_name: Sidekick
approach_type: agent
deployment_stage: scaled
year: 2026
first_public_evidence:
  date: 2026-03
  source_id: hubspot-sidekick-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: pull request → AI review comments
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  state: unknown
  identity: unknown
  evidence_strength: detailed-primary
summary: Sidekick is HubSpot's internal AI code reviewer, built by its Developer Experience AI team. It runs on every
  pull request in GitHub. A second Judge Agent evaluates each draft comment for succinctness, accuracy, and
  actionability, and only comments that pass are posted.
headline_metric: Reviews every pull request and cut engineer feedback time by 90%
architecture:
  harness: Aviator, an internal Java agent framework; replaced the earlier Claude Code review implementation on
    Crucible
  sandbox: unknown
  tool_access: Aviator framework for precise tool control
  interfaces:
  - github
  knowledge: Optional repo-specific custom instructions can be incorporated into the review prompt; the feature
    recently launched
primitives:
- {name: Trigger review, desc: "Review runs automatically when a pull request is created or marked ready for review, or when Sidekick is requested as a reviewer"}
- {name: Draft the review, desc: "Sidekick produces the initial review of the pull request"}
- {name: Judge each draft comment, desc: "A second Judge Agent evaluates every draft comment for succinctness, accuracy, and actionability"}
- {name: Post passing comments, desc: "Only comments that pass the judge evaluation are posted to GitHub; the rest are filtered out"}
key_metrics:
- Reviews every pull request
- Engineer feedback time cut by 90%
- Over 80% thumbs-up reaction rate on review feedback during the preceding couple of months
lessons_learned:
- Unhelpful rather than incorrect feedback was the most common failure mode; prompt tuning alone could not eliminate
  it, and a second judge agent filtering draft comments was the single most important factor in review effectiveness
