      - primitives.7
      note: The alert-to-resolution loop and the memory layers are mechanisms that support the run rather than
        steps in it, and the deterministic safeguards are recorded under validation.
    human_involvement:
      state: reported
      claim_paths:
      - operating_models.0
      - operating_models.1
      - operating_models.2
      - operating_models.3
      - primitives.8
      note: Four workflows have different boundaries. The on-call engineer reviews what the triage agent found;
        remediation returns as a pull request that a deterministic post-step forces to draft, so the agent can
        open a pull request but the post never says it merges or deploys; high-confidence benign or duplicate alerts
        are downgraded before anyone is paged; and the post documents no review step for the non-triage intents.
