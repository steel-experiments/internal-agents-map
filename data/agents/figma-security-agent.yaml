# yaml-language-server: $schema=../agent.schema.json
id: figma-security-agent
company: Figma
agent_name: Security alert triage and investigation agents
aliases:
- Tines Security Slackbot
approach_type: agent-system
deployment_stage: deployed
year: 2026
first_public_evidence:
  date: '2026-07-29'
  source_id: figma-security-agent-source-1
last_reviewed_at: '2026-09-21'
status: internal
domains:
- security
- on-call
- coding
autonomy: drafts-reviewed
operating_models:
- scope: Panther alert in a Slack thread → agent investigation and evidence chain → on-call engineer confirms or
    corrects
  attention_boundary: work-product-review
- scope: confirmed finding → agent-authored detection, suppression, or configuration change → draft pull request
    review
  attention_boundary: work-product-review
- scope: alert matching a high-confidence benign or duplicate precedent → automatic severity downgrade before
    anyone is paged
  attention_boundary: exception-only
- scope: platform security question or endpoint software approval inquiry routed to a non-triage agent
  attention_boundary: unknown
rubric:
  invocation:
  - event-driven
  - interactive
  state: cross-session-memory
  identity: mixed
  evidence_strength: detailed-primary
summary: >-
  Figma's security engineering team assembled an alert-response system from commercial parts rather than
  writing an agent framework: agent loops run inside Tines workflow automation on Claude models, and retrieval
  runs on AWS Bedrock Knowledge Bases and Amazon Kendra. Figma built the layers around them, including the Lambda
  handlers that index every Panther SIEM alert, intent routing to specialized agents, the scoped tool contracts,
  and the memory stores. A tagged Slack bot triages the alert with Okta, endpoint, Wiz, Slack, and Panther tools,
  delegates deeper questions to a sub-agent that writes Snowflake SQL against the security data lake, and can open
  pull requests against the detections repo or the monorepo.
headline_metric: Around 70% reduction in time-to-resolution on complex alerts, reported by Figma in July 2026

architecture:
  sandbox: unknown
  harness: 'Agent loops run inside Tines, a commercial workflow-automation product, which supplies the LLM loop
    and the explicit tool interfaces; Figma built the surrounding system: AWS Lambda handlers that index and post
    each Panther alert, a retrieval layer on AWS Bedrock Knowledge Bases and Amazon Kendra, webhook-triggered intent
    routing to specialized agents, the deterministic tool-calling contracts, and the memory stores. The core tool
    set is managed outside any individual agent as configuration-as-code.'
  model: Claude models, named by tier rather than by version. A lighter model such as Claude Sonnet performs intent
    routing and memory formatting; a model such as Claude Opus runs the alert triage agent and the Panther investigation
    sub-agent.
  interfaces:
  - slack
  - github
  - webhook
  tool_access: Each routed agent has its own scoped tool inventory and authorization layer. The alert triage agent's
    tools cover Okta profiles, groups, and login history; North Pole Security Workshop rule and event search, host
    sync status, and rule push for the Santa endpoint agent; Wiz audit logs, inventory, findings, and exposed resources;
    Slack thread reads, profile lookups, and progress updates; Panther alert details, raw triggering events, and
    related alerts; opening pull requests in the Panther detections repo or the monorepo; and delegation to the
    Panther investigation sub-agent.
  knowledge: 'Case memory is the Kendra and Bedrock corpus of past alerts plus investigation context, which is the
    comment an on-call engineer leaves in the Slack alert thread or the Asana ticket and which is indexed back onto
    the original alert. Retrieval is biased toward recent alerts and alerts that carry investigation context. The
    investigation sub-agent keeps a separate procedural memory store organized by data-source tags such as aws,
    okta, osquery, and workshop, holding schema findings written by a lighter model. Tines database records hold
    stateful objects such as open agent-created pull requests and Panther investigation state.'
  credentials: Authorization controls limit the agents to security team members, and Figma states that the agent
    works on behalf of an authorized team member and that its tools are scoped, authorized, and monitored. Pull
    requests the agent opens are authored by a service account, so the PR description carries the requesting engineer's
    name and a link to the originating Slack thread. The post does not document how the agent authenticates to
    each connected system.
  context_mgmt: The triage agent receives the full Slack thread history plus its steering-memory markdown document,
    loaded into context at the start of every run. It has no ambient access to whole Slack channels, and outside
    direct messages it can read a thread only when it is re-tagged on the latest message.

primitives:
- name: Alert-to-resolution loop
  desc: Panther alert → retrieval summary and precedent → intent routing → scoped-tool investigation → draft pull
    request
- name: Index the alert and retrieve precedent
  desc: A Lambda handler converts each Panther alert into a standardized document with structured attributes and
    indexes it into Kendra; the next similar alert queries Bedrock for semantic matches, biased toward recent alerts
    and alerts carrying on-call investigation context
- name: Post a first-pass summary and tag the bot
  desc: The Lambda stream handler posts the alert to Slack with the first-pass LLM summary and similar-alert references,
    then auto-tags the Tines Security Slackbot in the thread; on-call engineers can also tag the bot manually to
    ask follow-up questions
- name: Route the request by intent
  desc: The tag fires a webhook into Tines, where a lighter model reads the full Slack thread and classifies the
    request as alert triage, a platform security question, an app approval inquiry, or something else, and routes
    it to a specialized agent with its own scoped tool inventory, authorization layer, and system prompt
- name: Investigate with scoped tools
  desc: The alert triage agent pulls the actor's Okta profile and access, checks endpoint rules and events in Workshop,
    checks cloud findings in Wiz, reads linked Slack threads for past reasoning, and retrieves raw Panther events
- name: Delegate data-lake questions to the investigation sub-agent
  desc: For questions the direct tools cannot answer, the triage agent passes a natural-language query to a sub-agent
    that writes and runs Snowflake SQL against the Panther data warehouse, which ingests AWS CloudTrail, Okta system
    logs, GitHub audit events, GCP audit logs, osquery endpoint telemetry, Workshop and Santa events, Wiz findings,
    and about a hundred other tables
- name: Segment memory by precedent, policy, state, and schema
  desc: Case memory holds past alerts and investigation context, steering memory holds behavioral rules the agent
    can update when an engineer corrects it, Tines database records hold stateful objects, and the sub-agent's
    tagged procedural memory holds schema findings it saves after a discovery query
- name: Open a draft pull request for the fix
  desc: Detection rule, allowlist, and suppression changes go to the Panther detections repo, and infrastructure,
    service config, Terraform, RBAC, and IdP changes go to the monorepo; the agent picks up reviewer comments through
    a GitHub webhook, can respond or make further changes, and can rebase stale branches onto the latest master
- name: Enforce deterministic tool-call safeguards
  desc: Every pull request the agent creates is set to draft by a deterministic post-step in the Tines workflow
    rather than by a prompt instruction, and the same tool-calling contract keeps sensitive employee information
    out of Okta responses and stops the agent closing or modifying pull requests it did not author

key_metrics:
- Figma reports a 20% drop in on-call pages from automatically downgrading the severity of alerts the retrieval
  layer scored as high-confidence benign or duplicate
- Figma reports 25% fewer endpoint software approval requests, which it attributes to the agent detecting when
  a user is asking about a tool and directing them to comparable approved alternatives
- Figma reports meaningfully higher on-call engineer confidence in resolution quality, which it attributes to the
  agent's evidence chain being explicit and reviewable; no measurement is given
- Figma reports that the first question the investigation sub-agent was asked about Zoom activity needed multiple
  schema-discovery queries, and that the same question cost a single query after the sub-agent saved a procedural
  memory
- Figma states the system handles all initial security response work for the security team, and that the on-call
  engineer's job shifted from investigating from scratch to reviewing what the agent found

lessons_learned:
- Figma separates precedent from policy across memory layers, after saving everything as steering memory started
  overriding the agent's behavior in unwanted ways; a one-off lesson about a specific alert type goes into retrieval
  investigation context, and a behavioral rule that should change how the agent approaches all alerts goes into
  steering memory.
- Figma's security team says procedural memory should have been in the system from the start, because the investigation
  sub-agent's self-built schema memory was a late addition whose improvement was dramatic enough that the earlier
  work feels wasted in retrospect.
- Figma manages its core agent tool set in configuration-as-code outside any individual agent, after team members
  iterating quickly produced divergent copies of the same core agent with different tool configurations.
- Figma enforces controls as deterministic post-steps in the Tines workflow rather than as prompt instructions,
  after finding that relying on the model to remember an instruction such as always creating a pull request as
  a draft was not reliable enough.
- Figma includes the requesting security engineer's name and a link to the originating Slack thread in every agent-authored
  pull request, because bot-authored pull requests make git blame point at a service account; the team says it
  should have done this from the start.
- Figma's security team says it is more comfortable with agent autonomy when the action is bounded, reversible,
  and supported by clear evidence than when it is broad, destructive, or hard to audit, and that read-heavy investigation,
  duplicate detection, precedent retrieval, and draft remediation fit agentic execution better than generic high-powered
  write paths.
- Figma's security team advises designing the Slack trust model for public channels up front rather than bolting
  it on, because user-activity detail that is fine in a private security thread becomes a problem in a channel
  with a hundred people; Figma handles this with channel-aware prompt design and other deterministic controls.

