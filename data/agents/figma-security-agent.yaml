claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The post states that the on-call engineer's job shifted to reviewing what the agent found
      and confirming or correcting it, which locates human attention at the investigation write-up rather than
      during it.
    valid_at: '2026-07'
  operating_models.1:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The post says the agent opens pull requests and that a deterministic post-step sets every
      one of them to draft, so the review of the change is the documented boundary. Opening a pull request is the
      agent's authority; nothing in the post says the agent merges or deploys.
    valid_at: '2026-07'
  operating_models.2:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The severity-downgrade code path runs on a retrieval confidence score without a described
      human checkpoint, and Figma credits it with fewer on-call pages. The post does not say what happens to a
      downgraded alert afterwards, so the exception boundary is inferred from the reduced paging rather than stated.
    valid_at: '2026-07'
  operating_models.3:
    kind: inference
    provenance: catalog-judgment
    confidence: unverified
    confidence_reason: The post names platform security questions and app approval inquiries as separate routed
      agents with their own tools and prompts, but describes no review step for their answers. The boundary is
      undocumented, and the triage boundary must not be assumed to carry over.
    valid_at: '2026-07'
  headline_metric:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: 'Figma reports the figure in its own engineering blog with no measurement method, denominator,
      or interval, and hedges it as "around 70%". The page also states the result two ways: the standfirst says
      time-to-resolution was cut by 71% with no scope, while the body says around 70% on complex alerts. This record
      keeps the body wording because it is the more precise and more bounded of the two.'
    valid_at: '2026-07'
    reported_by: Figma
    metric_scope: Time-to-resolution on complex security alerts handled by the agent system
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Figma attributes the drop to the automatic severity downgrade alone and repeats it in the
      results paragraph, but reports no baseline period, denominator, or method. The downgrade runs in the retrieval
      layer on a confidence threshold, not in the triage agent.
    valid_at: '2026-07'
    reported_by: Figma
    metric_scope: On-call pages, after automatically downgrading high or critical alerts scored as high-confidence
      benign or duplicate
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: The figure appears only in the summary list of results, with the mechanism Figma credits
      for it but no baseline, denominator, or method.
    valid_at: '2026-07'
    reported_by: Figma
    metric_scope: Endpoint software approval requests reaching the security team
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: Figma states engineer confidence is meaningfully higher but gives no survey, scale, or other
      measurement, so this is a qualitative impression reported alongside the numeric results.
    valid_at: '2026-07'
    reported_by: Figma
    metric_scope: On-call engineer confidence in resolution quality
  key_metrics.3:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: The before-and-after query counts come from one worked example about Zoom activity that
      Figma uses to illustrate procedural memory; the post says the pattern repeated across data sources but gives
      no aggregate.
    valid_at: '2026-07'
    reported_by: Figma
    metric_scope: Queries the investigation sub-agent needed for one repeated data-lake question, before and after
      it saved a schema memory
  key_metrics.4:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Figma states the coverage directly, but gives no alert counts, exclusions, or period, so
      the scope of "all initial security response work" rests on the team's own characterization.
    valid_at: '2026-07'
    reported_by: Figma
    metric_scope: Initial security response work for Figma's security team
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The post places the agent loops in Tines and has the sub-agent execute SQL against Snowflake,
      but documents no execution isolation boundary for agent-run code; unknown does not mean absent.
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The memory section states the split and names the early mistake of saving everything as
      steering memory, including the consequence it produced.
  lessons_learned.1:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: This is the team's own hindsight preference in the "In hindsight" list. The underlying improvement
      is illustrated by one example and a general claim that the pattern repeated, not by measured results across
      data sources.
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The hindsight list states both the fragmentation problem and the configuration-as-code arrangement
      Figma runs today.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The guardrails section states that the draft setting is a deterministic post-step in the
      Tines workflow and gives the reliability failure that led to it.
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The code-changes section states the practice, the git blame reason behind it, and the team's
      view that it should have been there from the start.
  lessons_learned.5:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: This is Figma's stated comfort boundary for autonomy, not a measured finding, and it is
      bounded to the action types this security workflow performs.
  lessons_learned.6:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The hindsight list gives this as advice from Figma's experience with a Slack-integrated
      security agent, with the controls Figma uses; the post reports no incident that tested them.

