rubric:
  invocation:
  - event-driven
  - interactive
  state: unknown
  identity: unknown
  evidence_strength: detailed-primary
summary: A multi-agent orchestration layer built on goose + MCP that coordinates agents across Block's entire codebase,
  invoked in Slack to take a ticket end-to-end to a reviewed PR.
headline_metric: ~1,500 PRs merged per week (~15% of all production code changes at Block)
architecture:
  sandbox: unknown
  harness: Multi-agent orchestration built on goose (open-source agent framework) + MCP; multi-player, real-time,
    operating inside Slack threads
  model: goose framework; model not specified
  interfaces:
  - slack
  - linear
  - jira
  - github
  tool_access: MCP connects agents to internal tools and data; picks up Linear/Jira tickets, creates the branch,
    writes code, opens the PR, watches CI
  knowledge: Company-wide code context across hundreds of millions of lines and hundreds of services; Block also
    frames Builderbot as an 'agentic protector' around its software world model
  context_mgmt: Progressive disclosure pairs a global world model with hyperlocal context through nested AGENTS.md
    files, module-scoped .agents/checks review prompts, and hundreds of internal Agent Skills from an internal Skills
    Marketplace
primitives:
- name: Orchestration layer
  desc: Coordinates multiple agents over one codebase instead of running a single loop
- name: Ticket-driven flow
  desc: Linear/Jira ticket → branch → code → PR → CI watch, end to end
- name: Slack thread start
  desc: Anyone tags @builderbot in Slack with a short description and it researches, plans, and implements in that
    thread while teammates steer in real time
- name: CI watch and iteration
  desc: After opening the pull request, Builderbot watches CI and iterates based on feedback; humans step in where
    they add the most value
- name: Review protector gate
  desc: The sq agents review entrypoint dispatches parallel global and module-scoped review subagents against a
    pull request and verifies world-model alignment before humans grant final approval
key_metrics:
- 200,000+ operations per day
- ~1,500 pull requests merged per week (~15% of all production code changes at Block)
- '"What used to take months now takes days"'
lessons_learned:
- Block's engineering lead credits Builderbot with handling scaffolding while engineers make product decisions.
- A Slack mention starts Builderbot in the existing thread, where colleagues can follow the work.
- Several people can steer Builderbot while it researches, plans, and implements a change.
