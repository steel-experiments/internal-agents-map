claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The post describes an engineer opening the session, pointing Ask Mode at the symptom, and
      pulling each MCP source into the thread step by step, which places attention with the engineer throughout the
      investigation; it never describes an investigation running without one."
    valid_at: "2026-03"
  operating_models.1:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The subagent section states that the parallel results merge into a single output that the
      team reviews and sends, which locates the return of attention at the merged work product; the post does not
      say how long the parallel run proceeds unattended."
    valid_at: "2026-03"
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The post says the full codebase is available locally and that a cloud agent opens docs pull
      requests, but documents no execution isolation boundary for either; unknown does not mean absent."
  headline_metric:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: "Cursor states both figures in one sentence of its own blog post with no measurement period,
      no definition of a support interaction, no denominator, and no method; 'over 75%' is a floor and '5-10x' is a
      range, and neither is independently verified."
    valid_at: "2026-03"
    reported_by: Cursor
    metric_scope: "Cursor support interactions and support engineer throughput, as stated in March 2026"
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: "The share is a self-reported floor with no measurement period and no definition of a support
      interaction, so the true value and the base it is taken over both stay open."
    valid_at: "2026-03"
    reported_by: Cursor
    metric_scope: "Share of Cursor support interactions that run through Cursor itself"
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: "Cursor reports a 5-10x throughput range without saying what throughput counts, over which
      period, or against which baseline, so the range cannot be reduced to a point estimate."
    valid_at: "2026-03"
    reported_by: Cursor
    metric_scope: "Support engineer throughput after support work moved into Cursor"
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: "The closing section marks this figure as the team's own estimate, bounds it with 'as much
      as', and compares it to unspecified traditional approaches, so it is a hedged self-assessment rather than a
      measured result."
    valid_at: "2026-03"
    reported_by: Cursor
    metric_scope: "Productivity of the support team against traditional approaches that require jumping between
      tools and across teams"
    measurement_method: "Team estimate; the post gives no method"
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "The known-issue section states the search order and the three properties the team wants in
      the thread it picks; it reports the team's practice and does not measure how often that search succeeds."
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "The post gives the multi-root workspace rationale with a worked example, a disabled button
      spanning frontend, backend, and docs; it reports the arrangement without comparing it to separate workspaces."
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "The documentation-updates section states the trigger, the Slack mention, and the cloud agent
      pull request; it describes the routine and reports no volume or acceptance rate for those pull requests."

