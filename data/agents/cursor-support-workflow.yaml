    attention_boundary: continuous-steering
  - scope: "parallel subagent run → merged escalation, customer reply, or docs pull request"
    attention_boundary: work-product-review
rubric:
  invocation: [interactive, background]
  state: unknown
  identity: unknown
  evidence_strength: limited-primary
summary: "Cursor's technical support team runs customer investigations inside Cursor itself, configured for support
  work: multi-root workspaces over the product repositories, MCP servers that reach customer databases, event logs,
  Slack, the ticket tracker, and internal runbooks, plus slash commands, Rules and Skills, and four named subagents
  whose merged output an engineer reviews before sending."
headline_metric: "Cursor reports that over 75% of its support interactions run through Cursor itself and that support
  engineer throughput increased 5-10x; the post gives no measurement period, denominator definition, or method."

architecture:
  sandbox: unknown
  harness: "Cursor's own editor and agent product configured for support investigations: multi-root workspaces over
    several repositories, Ask Mode investigations, MCP servers for support systems, slash commands, Rules and Skills,
    subagents, and a Slack-triggered cloud agent that opens documentation pull requests"
  interfaces:
    - cursor
    - slack
  tool_access: "MCP servers reach customer databases holding subscription tier and team and privacy settings,
    streamed event logs covering services used, telemetry errors, and network issues, Slack threads, engineering
    ticket platforms, an internal documentation service of runbooks and troubleshooting guides, and an account
    management service; the named integrations are Datadog for logs and traces, the support platform and Slack for
    prior cases, Notion for runbooks, and Linear for escalations"
  knowledge: "The full codebase is available locally, and Cursor indexes and semantically searches product code,
    docs, and internal tooling in the same session; runbooks and troubleshooting guides, Slack threads, and past
    support conversations arrive through MCP servers"
  context_mgmt: "One Cursor session collapses code, logs, team knowledge, and past conversations; multi-root
    workspaces keep related repositories together so a question spanning frontend logic, backend policy checks, and
    docs stays answerable in a single thread; subagent results merge into a single output"

primitives:
  - name: "Collapse support context into one session"
    desc: "Code, logs, team knowledge, and past conversations come together in a single Cursor session, which the
      team describes as removing the context-gathering bottleneck for most of its work"
  - name: "Trace the symptom in Ask Mode"
    desc: "The investigation typically starts in Ask Mode pointed at the symptom, tracing backward through the
      relevant product behavior with indexed semantic search over product code, docs, and internal tooling"
  - name: "Connect the support systems through MCP servers"
    desc: "MCP servers bring customer databases, streamed event logs, Slack, engineering ticket platforms, an
      internal runbook service, and an account management service into the investigation instead of making the
      engineer search each tool separately"
  - name: "Identify where the failure occurred"
    desc: "Datadog MCP pulls the relevant logs and traces into the investigation thread to narrow whether the
      problem is reproducible or transient and whether it failed client-side, at the API edge, in a downstream
      dependency, or in auth"
  - name: "Track down similar cases"
    desc: "Searches across the support platform and Slack start from hard identifiers such as error strings and
      request IDs, broaden if needed, and look for the newest thread carrying a current status, a workaround, and
      an owner"
  - name: "Decide bug or expected behavior"
    desc: "Notion MCP pulls the relevant runbook into the thread to cross-reference what the engineer is seeing,
      then either confirms the behavior or supports a clearer escalation"
  - name: "File the escalation from the same thread"
    desc: "The Linear MCP turns the material gathered during the investigation into a formatted escalation without
      leaving the thread"
  - name: "Request a documentation fix from Slack"
    desc: "When several customers hit the same question, a mention of the Cursor agent in Slack with what needs
      updating sends a cloud agent to open a pull request against the docs repository"
  - name: "Slash commands, Rules, and Skills for repeated steps"
    desc: "Slash commands cover the most frequently repeated steps of the process, and Rules and Skills automate
      common processes in support investigations; the captured page does not list the individual commands, rules,
      or skills"
  - name: "Subagents run steps in parallel"
    desc: "LogInvestigator searches Datadog for the failure point and supporting evidence, KnownIssueMiner scans
      Slack and Notion for prior threads and workarounds, TicketWriter formats the evidence into a complete
      escalation, and CustomerReplyDrafter writes the customer response with internal details stripped out; the
      results merge into a single output"

key_metrics:
  - "Cursor reports that over 75% of its support interactions run through Cursor itself"
  - "Cursor reports that running support through Cursor increased support engineer throughput 5-10x"
  - "Cursor estimates the combined workflow makes its support team as much as an order of magnitude more productive
    than traditional approaches that require jumping between tools and across teams"

lessons_learned:
  - "Cursor's support engineers search prior cases by hard identifier first, such as an error string or request ID,
    broaden the search only if that fails, and take the newest thread that carries a current status, a workaround,
    and an owner."
  - "Cursor keeps the repositories a support question spans in one multi-root workspace, so a question about
    frontend logic, backend policy checks, and documented expected behavior stays answerable in a single thread."
  - "Cursor's support team treats several customers asking the same question as a documentation gap and files the
    fix itself, mentioning the Cursor agent in Slack to get a pull request opened against the docs repository."

