summary: Roast is the workflow orchestration framework Shopify's Augmented Engineering Developer Experience team
  extracted from its internal AI tools and open-sourced; Shopify runs Roast workflows internally to interleave
  AI steps with deterministic code.
architecture:
  sandbox: unknown
  harness: "As released in 2025: a Ruby command-line framework that reads a workflow.yml file and matching markdown
    prompt files, interprets each step from its structure, and can be used with any programming language."
  model: An OpenAI API key is a prerequisite, or OpenRouter for other models; the Raix library abstracts AI providers
    and adds retry, caching and structured output; the built-in CodingAgent tool is powered by Claude Code.
  tool_access: Built-in ReadFile, WriteFile, UpdateFiles, Grep, SearchFile, Cmd, Bash and CodingAgent tools; WriteFile
    carries security restrictions and Cmd carries configurable restrictions.
  knowledge: Markdown prompt files use ERB templating to read the workflow context; complex logic goes in custom
    Ruby step classes that inherit from BaseStep.
  credentials: An OpenAI or OpenRouter API key is required; Raix initializers in the .roast/initializers directory
    can add custom authentication schemes.
  context_mgmt: Steps in a workflow share their conversation transcript, so a later step references earlier discoveries
    without extra configuration; every execution is saved so a run can resume from any step.
  interfaces:
  - cli
primitives:
- name: Clean up the test file
  desc: Deterministic sed steps clean up the code before any AI step runs.
- name: Bump the file to strict typing
  desc: The workflow raises the test file to strict Sorbet typing.
- name: Run Sorbet autocorrect
  desc: Sorbet's autocorrect resolves the type errors it can fix on its own.
- name: Hand remaining issues to the coding agent
  desc: The CodingAgent iteratively fixes the type errors the deterministic steps left behind.
- name: Confirm the file passes
  desc: The workflow runs the tests and ensures that both the tests and type checking pass.
- name: Declarative workflow definition
  desc: A workflow.yml file and matching prompt.md files define the steps, and Roast interprets each step from
    its structure.
- name: Mixed deterministic and AI steps
  desc: Directory prompts, shell commands wrapped in $(), inline prompts, custom Ruby step classes and nested-array
    parallel steps run in one workflow.
- name: Advanced control flow
  desc: Workflows iterate over collections, execute steps conditionally and branch with case statements.
- name: Built-in tool set
  desc: ReadFile, WriteFile, UpdateFiles, Grep, SearchFile, Cmd and Bash are supplied out of the box.
- name: CodingAgent step
  desc: A Claude Code integration runs as a step and iterates within the guardrails and objectives the workflow
    author sets.
- name: Shared transcript
  desc: Steps share their conversation transcript so later steps build on the context earlier steps produced.
- name: Session replay
  desc: Roast saves every workflow execution so development resumes from any step instead of rerunning expensive
    AI operations.
key_metrics:
- Shopify engineers analyzed thousands of test files with Roast, identifying and fixing common antipatterns and
  increasing test coverage; the post reports no count, period or baseline.
- A dozen engineers had contributed features and workflows to the public Roast repository by publication.
lessons_learned:
- Shopify says AI agents need help staying on track and work much better when a complicated prompt is broken into
  discrete steps; letting AI roam free around millions of lines of code did not work well for its unit-test work.
- For type annotation, Shopify runs deterministic cleanup and Sorbet autocorrect first and hands only the remaining
  issues to the coding agent.
- Shopify says saving every workflow execution and resuming from any step speeds up workflow development because
  expensive AI operations are not rerun.
- Shopify describes using an AI step as a placeholder for a part of a workflow the author does not yet understand,
  then replacing it with deterministic code once the problem is clearer.
