claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: unverified
    confidence_reason: The post follows the Boba workflow to a file where tests and type checking pass and says
      the team pursued unit-test work with minimal human intervention, but it names no point at which a person
      reviews the result.
    valid_at: '2025-06'
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The reviewed sources describe WriteFile security restrictions and configurable Cmd restrictions
      but no execution or isolation boundary; unknown does not mean absent.
  architecture.harness:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The 2025 post describes the YAML-and-markdown design in detail; the repository captured
      in 2026 documents a Ruby DSL instead, so the claim is scoped to the release the post describes.
    valid_at: '2025-06'
  architecture.model:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The post names the API-key prerequisite, Raix, and Claude Code behind the CodingAgent, but
      never names the model a plain AI step uses; the repository captured in 2026 lists a different provider set.
    valid_at: '2025-06'
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: Shopify reported an approximate scale in its own engineering blog with no count, measurement
      window, coverage baseline or method.
    valid_at: '2025-06'
    reported_by: Shopify
    metric_scope: Test files analyzed with Roast workflows inside Shopify
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: Shopify reported an approximate contributor count for its public repository without a period,
      and without saying whether the contributors are Shopify employees or outside developers.
    valid_at: '2025-06'
    reported_by: Shopify
    metric_scope: Engineers who had contributed features and workflows to the public Roast repository as of publication
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The opening section states this as what the team learned while building AI workflows for
      unit-test grading; it is Shopify's account of its own experience, with no measurement behind it.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The CodingAgent section and the internal-impact section both describe this step order for
      Boba; the post does not compare it against an all-agent alternative, so it stays a description of Shopify's
      own workflow.
  lessons_learned.2:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The session-replay section asserts the speed-up for workflow authors; the post reports no
      development-time measurement.
  lessons_learned.3:
    kind: opinion
    provenance: reported
    confidence: low
    confidence_reason: The closing section presents this as the post author's reading of a quoted Shopify engineer;
      the Steel capture preserves the author's paragraph but drops the quotation it interprets, so the engineer's
      own wording was not reviewed from the capture.
