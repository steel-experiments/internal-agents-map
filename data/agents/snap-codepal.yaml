    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: Snap's merged pull request rate year-to-date, reported as context for building CodePal rather
      than as a CodePal result
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The lessons section states this as Snap's own conclusion from the misses reported to the
      team; no counts of missed bugs or model comparisons are published to support it.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Snap reports both the zero-configuration result for most repositories and the noise its
