  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The closing section states directly that CodePal reviews human-written and AI-written code
      and that every pull request still requires a final engineering approval.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: Snap names both reasons it rejected vendor tools and dates the demo at two weeks; the
      procurement comparison is Snap's own account of its evaluation.
  lessons_learned.4:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: Snap describes the voting mechanism as fact and the flywheel as its own reading of it; the
      article shows no measurement that engagement improved later reviews for the engineers who voted.
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The article documents in-memory, no-clone repository access but no execution or isolation
      boundary; unknown does not mean absent.

