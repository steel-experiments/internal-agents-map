claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The source states that engineers judge each posted finding, that their reactions are
      recorded as ground truth, and that every pull request still requires a final engineering approval, so
      attention returns on the review output rather than on an outcome or an exception.
    valid_at: '2026-06'
  headline_metric:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap reports the review count and the coverage share in its own engineering blog; the
      thousands of confirmed issues carry no counting rule and none of the figures are independently reviewed.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: CodePal reviews over the last 4 months before publication; the source dates the window
      relatively and gives no calendar range
    denominator: 90% of all pull requests at Snap
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap states the start and end points of the ramp in its own blog; the quarter is named
      only as a single quarter and no rollout dates are given.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: Share of pull requests receiving a CodePal review, from virtually no AI-reviewed pull requests
      to over 90%, within a single unnamed quarter
    denominator: All pull requests at Snap
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: The adoption narrative gives the 9% starting point, the 300-repository figure, and the
      sentiment share, but does not date the stages or say how sentiment was collected at that point.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: The opt-in phase of the CodePal rollout, before teams were auto opted in
    denominator: Pull requests at Snap for the 9% figure; repositories for the 300-repository figure
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap reports the recall change twice and names the evaluation framework behind it, but
      publishes neither the dataset size nor its definition of a recallable bug.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: Recall of true positives, reported as climbing during the same quarter in which adoption
      reached 90%; the source gives no calendar dates
    measurement_method: An evaluation framework with a ground truth dataset formed from real engineer feedback,
      used to AB test CodePal changes
  key_metrics.3:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap states the 0% rate and volunteers the limit that it was measured on a held-out golden
      dataset rather than on live traffic, which bounds what the number shows.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: False positive rate on the held-out golden dataset, explicitly not on live traffic
    measurement_method: Measurement against the held-out golden dataset in the evaluation framework
  key_metrics.4:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: Snap reports the relative increase without naming the baseline period, the absolute counts,
      or whether review volume grew over the same span.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: Bugs found with a positive rating, compared with an unnamed earlier period
  key_metrics.5:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: The 80% sentiment figure appears in both the adoption section and the closing numbers; the
      source does not state how the sentiment share is collected or over how many findings.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: Engineer sentiment on CodePal bug findings
  key_metrics.6:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap gives a completion bound for CodePal and a median for the human comparison; the
      CodePal figure is stated as within 10 minutes rather than as a median, and neither figure is dated.
    valid_at: '2026-06'
    reported_by: Snap
    metric_scope: CodePal review completion time against the median wait for the first human review on a Snap
      pull request
  key_metrics.7:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Snap reports an average unit cost without a measurement window or a statement of what the
