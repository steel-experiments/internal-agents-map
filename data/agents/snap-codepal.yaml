summary: Snap built CodePal, an internal AI code reviewer that comments on pull requests in its GitHub Enterprise
  instance before a human reviewer reads them. It builds symbolic context for the diff without cloning the
  repository, runs a multi-pass review loop with a verifier that audits every finding, and posts bug findings, a
  semantic diff summary, and a generated pull request description. Snap reports that CodePal reviews 90% of all its
  pull requests today, and that every pull request still requires a final engineering approval.
headline_metric: More than 200,000 reviews across 90% of all pull requests over the last 4 months, catching
  thousands of confirmed issues that were corrected before human review and before reaching production

architecture:
  sandbox: unknown
  harness: A parent workflow builds the review context once and writes it to a shared store that three child
    workflows for code review, summary generation, and description generation all read; the review loop runs
    concurrent model passes under a supervisor with an agreement gate and an eager hand-off, alongside a separate
    long-running verifier conversation
  interfaces:
  - github
  tool_access: Reads git tree diffs and only the required source blobs through the GitHub Enterprise API without
    cloning, and for a growing share of reviews queries Code Search, Snap's internal semantic search over the full
    codebase
  knowledge: Repository-level customization through a .codepal.yaml file and per-path instructions, and
    repository-specific review checks on top of the shared bug categories
  context_mgmt: A two-pass file picker scores repository files by symbol overlap with the diff and selects the top
    N within a token budget, so a typical review reads a few hundred KB of source whatever the repository size;
    reviews are also chunked into logical parts to avoid overwhelming the model

primitives:
- name: Diff-to-review pipeline
  desc: Pull request diff → symbolic context build → multi-pass review loop → verified findings, a semantic diff
    summary, and a generated description posted on the pull request
- name: Read the code without a clone
  desc: Every review runs in memory against the GitHub Enterprise API, using git tree diffs to identify what
    changed and fetching only the needed blobs, with no working copy written to disk and no long-lived repository
    mirror
- name: Build symbolic context with a two-pass file picker
  desc: The first pass parses the repository with tree-sitter to build a symbol-to-file index; the second pass
    extracts the symbols the diff references, scores files by symbol overlap, and selects the top N files within
    the token budget
- name: Share one context build across three child workflows
  desc: A parent workflow runs the symbol indexing and file selection once and writes the result to a shared
    store, which the code review, summary generation, and description generation child workflows all read
- name: Run two bootstrap passes in parallel
  desc: Two passes start together on the same model with different sampling parameters, and comparing their
    findings shows which findings the model actually believes
- name: Launch a speculative third pass behind an agreement gate
  desc: A third pass starts in a cancellable context as soon as one bootstrap pass finishes; the supervisor
    discards its work when the two bootstrap passes agree and counts it when they disagree
- name: Hand off to the next pass as soon as a finding is new
  desc: From the third pass onward, a pass that surfaces a finding the supervisor has not seen launches the next
    pass without waiting for the current one to finish, and a pass with no net-new findings gets no successor
- name: Detect bugs that compilation and tests miss
  desc: CodePal looks for logic errors, null pointer risks, race conditions, resource leaks, error handling gaps,
    type mismatches, edge cases, and state management problems, and Snap expanded the detection scope from 8 bug
    categories to 12
- name: Track dependencies across repositories
  desc: For a growing share of reviews CodePal queries Code Search to identify the downstream callers a function
    signature change would break, including callers that live in a different repository than the pull request
    touches
- name: Re-review each new commit incrementally
  desc: Each new commit triggers a focused re-review, with auto-resolution of findings whose files have left the
    diff
- name: Verify each finding before it is posted
  desc: The Verifier, a separate long-running model conversation, consumes findings as they merge and audits each
    one against the supplied context, for example checking that every symbol a finding cites is present in that
    context
- name: Turn engineer reactions into ground truth
  desc: The Finding Lifecycle records a thumbs up or thumbs down on each CodePal comment, together with findings
    that authors fix and findings merged without being addressed, and aggregates them into the ground truth
    dataset
- name: AB test every change against the evaluation framework
  desc: An evaluation framework built on the ground truth dataset AB tests new CodePal changes, targeting higher
    true-positive recall and fewer false positives, with speed and cost kept as guardrails

key_metrics:
- Adoption went from 0% to 90% of pull requests within a single quarter
- CodePal started as an opt-in experiment on 9% of pull requests and reached voluntary use across 300
  repositories with more than 70% positive sentiment before teams were auto opted in
- The recall rate of true positives climbed from 30% to 80%
- The false positive rate on the golden dataset dropped to 0%, measured on the held-out golden dataset and not on
  live traffic
- CodePal finds 75% more bugs with a positive rating than it did before the recall work
- Engineer sentiment on bug findings reached 80% positive
- CodePal reviews complete within 10 minutes, while the median wait for a first human review is about 5 hours
- Reviews cost on average about $0.40 each
- The majority of accepted bugs, meaning findings that received a +1 vote in the pull request review, rank as
  Critical or High severity
- Snap's merged pull request rate is up 60% year-to-date, which the article attributes to daily engineer use of AI
  coding tools rather than to CodePal

lessons_learned:
- Snap concluded that for its own missed bugs the context supplied to the model mattered more than picking a
  top-tier model, and it chunks each review into logical parts so the model is not overwhelmed.
- CodePal produces high-quality reviews with zero configuration in most Snap repositories, but Snap reports that
  its largest and most complex repositories generate noise until teams invest in .codepal.yaml configuration and
  per-path instructions.
- 'Snap keeps a human approval gate: CodePal reviews code written by humans and AI alike, and every pull request
  still requires a final engineering approval.'
- Snap built CodePal in-house after evaluating vendor tools, citing integration depth with its internal systems
  and speed; a working end-to-end demo shipped in two weeks, before the procurement cycle had finished.
- Snap reports that voting on every CodePal comment creates a flywheel, because the recorded feedback influences
  future reviews and the engineers who engage most shape what CodePal surfaces for them.

