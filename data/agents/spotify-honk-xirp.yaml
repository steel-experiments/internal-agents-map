  state: durable-session
  identity: unknown
  evidence_strength: detailed-primary
summary: Honk is Spotify's background coding agent (high confidence); Xirp is the workspace/context/session layer
  around it (medium confidence). Honk runs on a Claude-Agent-SDK harness in Kubernetes, uses trusted CI tools, and
  combines formatting and linting with LLM-based diff evaluation.
headline_metric: 1,500+ merged pull requests generated by Honk
architecture:
  sandbox: Honk runs in a constrained Kubernetes container (it does not inherit arbitrary engineer credentials);
    jobs execute inside Fleet Management / Fleetshift
  harness: 'Honk: Claude Agent SDK + Spotify''s own harness + Kubernetes pods; Honk v2 adds shared sessions, projects,
    and Chirp orchestration'
  model: Claude via the Agent SDK (Claude-centric); the surrounding platform is multi-model
  interfaces:
  - slack
  - github
  - cli
  tool_access: Limited, deliberate tool surface; trusted CI tools verify changes, while an internal CLI runs formatting
    and linting through MCP and evaluates diffs with an LLM judge
  knowledge: Backstage/catalog ownership and developer-standardization primitives built over years, exposed via
    MCP/CLI
  credentials: Runs in a constrained container rather than inheriting engineer credentials
  context_mgmt: Fleet Management coordinates repo targeting, builds/tests, and PR workflow at scale; Xirp pairs
    sessions with Portal org context
primitives:
- name: Deterministic and model-based verification
  desc: The harness combines build/test tools, formatting and linting, and LLM-based diff evaluation
- name: Fleet management
  desc: Target thousands of repos, run builds/tests, open and merge PRs at fleet scale
- name: Xirp (workspace/context layer)
  desc: The session/context surface around the agent rather than an autonomous worker itself
key_metrics:
- 1,500+ merged AI-generated PRs (Honk)
- 60-90% time savings on migrations vs manual
- Around half of Spotify PRs automated by Fleet Management since mid-2024, including deterministic transformations
lessons_learned:
- Combine deterministic build, formatting, and lint checks with LLM-based diff evaluation
- Constrain the agent's environment and tools rather than handing it engineer credentials
- Invest in org context (Backstage/catalog) before agentic dev accelerates
- Autonomy without structure fragments into per-engineer configs; shared org context is the multiplier
