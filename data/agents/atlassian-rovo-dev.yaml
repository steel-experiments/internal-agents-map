id: atlassian-rovo-dev
company: Atlassian
agent_name: Rovo Dev
aliases:
- RovoDev
- HULA
approach_type: agent
deployment_stage: scaled
year: 2024
first_public_evidence:
  date: 2024-11
  source_id: atlassian-rovo-dev-source-3
last_reviewed_at: '2026-09-16'
status: commercialized
domains:
- coding
- code-review
autonomy: human-in-loop
operating_models:
- scope: Jira issue → reviewed pull request
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  state: unknown
  identity: unknown
  evidence_strength: detailed-primary
summary: Rovo Dev is Atlassian's coding agent, available internally on all Jira sites. It works from a Jira work
  item to a pull request, and the developer reviews the plan and the code at each step. It became generally available
  in October 2025.
headline_metric: Dogfooded across 1,900+ repositories with a 50,000+ comment internal dataset
architecture:
  harness: Built on the HULA framework, which runs set context, generate plan, generate code, and raise PR
  model: 'Rovo Dev Code Reviewer runs Anthropic Claude 3.5 Sonnet, with a gpt-4o-mini judge for factual checks'
  context_mgmt: Top-50 similar resolved Jira work items and their merged PR diffs attach as additional run context
  interfaces:
  - jira
primitives:
- {name: Set the context, desc: 'The user provides the repository and the work-item description the agent needs'}
- {name: Generate the plan, desc: 'The agent generates a plan that the user can review and refine before it proceeds'}
- {name: Generate the code, desc: 'The agent writes the code, and the human can review it and request changes'}
- {name: Raise the pull request, desc: 'The agent raises the PR, and the user reviews it and merges it'}
- {name: Filter review comments through two checks, desc: 'A gpt-4o-mini judge drops factually incorrect comments
    and a fine-tuned ModernBERT drops unactionable ones before posting'}
key_metrics:
- Dogfooded across 1,900+ repositories over more than a year
- Trained on a proprietary internal dogfooding dataset of 50,000+ Rovo Dev comments
- Median PR cycle time reduced by 30.8% over the year-long evaluation
- Human-written review comments reduced by 35.6%
