summary: Atlassian's internal coding agent, built on the HULA (Human-in-the-loop software development agents)
  framework. Rovo Dev works inside Jira and runs a four-step cycle (set context, generate a plan, generate
  code, and raise a pull request). Atlassian dogfooded it across all Jira sites for more than a year across 1,900+
  repositories. It reached general availability in October 2025.
headline_metric: Dogfooded across 1,900+ repositories with a 50,000+ comment internal dataset
