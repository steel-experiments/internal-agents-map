  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  - interactive
  state: unknown
  identity: unknown
  evidence_strength: detailed-primary
summary: Forge, previously Claudebot, turns employee discussions into Linear issues, drafted fixes and pull requests
  returned for review. Coinbase separately uses Mux to host concurrent coding-agent workspaces.
headline_metric: 5% of all PRs merged come from in-house background agents (Feb 2026)
architecture:
  sandbox: 'Separate Mux platform context: concurrent agents receive separate git worktrees, branches and terminals.
    The sources do not establish this as Forge’s execution environment.'
  harness: Portfolio approach; Claude Code, OpenCode, Cursor, and Copilot rather than one harness; Forge is a custom
    Slack-native harness with the same tools and context as engineers, invokable from Slack, GitHub, and Linear;
    built in-house because security requirements blocked cloud background agents
  model: The Slack agent Claude bot can use multiple underlying models despite its name; the documented portfolio
    spans harnesses (Claude Code, OpenCode, Cursor, Copilot), and no source names the models' providers
  interfaces:
  - slack
  - github
  - linear
  tool_access: Linear treated as the structured product context / source of truth
  knowledge: Linear as the durable structured-context layer for product work
  context_mgmt: Slack discussions become labelled, sized Linear issues that carry the work context; the feedback
    pipeline summarizes recordings into a reviewable issue before an agent acts
primitives:
- name: Forge
  desc: 'Custom harness: Slack bug discussion → Linear issue → drafted fix → PR pushed back for review'
- name: Mux
  desc: One person coordinates coding agents with separate worktrees, branches, and terminals
- name: Orchestrate concurrent agents
  desc: 'Separate Mux context: An engineer runs several agents in parallel, each on its own worktree, and reviews,
    gives feedback, and merges as each finishes'
key_metrics:
- 'Mux: 600+ users including engineers, PMs, and designers (335 active, 197 power users)'
- 5% of all PRs merged come from in-house background agents (Feb 2026)
- Wallet rewrite PR review times reduced from 150 hours to 15 hours (self-reported; period and method not documented)
- 'Speed run: about 100 participants opened about 70 PRs in 15 minutes (opened, not merged; single event)'
- 'Mux: 5,068 merged PRs across 461 repositories and 10 orgs'
- Mux users show 3.5x more merged PRs per engineer than baseline (39.6 vs 11.4); the post cautions users may skew
  toward already-high-output engineers
lessons_learned:
- Coinbase engineers use Mux alongside Claude Code, OpenCode, Cursor, and other internal agents.
- Coinbase stores requirements and work status in Linear; its Slack workflow creates an issue before Forge drafts
  a fix.
- Mux gives concurrent agents separate worktrees, branches, and terminals. This separates edits; it does not establish
  a security sandbox.
- Coinbase reports that security requirements prevented it from using available cloud background agents and motivated
  its internal harness.
- Coinbase describes its Slack harness as giving agents the same tools and context as engineers, with a PR returned
  to the thread.
- Chintan Turakhia favors demonstrations and shared experiments for adoption, citing PR speed runs and a Cursor
  Wins channel.
