# yaml-language-server: $schema=../agent.schema.json
id: coinbase-forge-mux
company: Coinbase
agent_name: Forge
aliases:
- Claudebot
- Claude bot
approach_type: agent
deployment_stage: scaled
first_public_evidence:
  date: '2026'
  source_id: coinbase-forge-mux-source-2
last_reviewed_at: '2026-10-09'
status: internal
domains:
- coding
- code-review
autonomy: drafts-reviewed
operating_models:
- scope: Slack, GitHub, or Linear request → drafted fix and pull request pushed back for review
  attention_boundary: work-product-review
rubric:
  invocation:
  - event-driven
  - interactive
  evidence_strength: detailed-primary
summary: Forge, previously Claudebot, turns employee discussions into Linear issues, drafted fixes and pull requests
  returned for review. Coinbase separately uses Mux to host concurrent coding-agent workspaces.
headline_metric: 5% of all PRs merged come from in-house background agents (Feb 2026)
architecture:
  harness: Portfolio approach; Claude Code, OpenCode, Cursor, and Copilot rather than one harness; Forge is a custom
    Slack-native harness with the same tools and context as engineers, invokable from Slack, GitHub, and Linear;
    built in-house because security requirements blocked cloud background agents
  model: The Slack agent Claude bot can use multiple underlying models despite its name; the documented portfolio
    spans harnesses (Claude Code, OpenCode, Cursor, Copilot), and no source names the models' providers
  interfaces:
  - slack
  - github
  - linear
  tool_access: Linear treated as the structured product context / source of truth
  knowledge: Linear as the durable structured-context layer for product work
  context_mgmt: Slack discussions become labelled, sized Linear issues that carry the work context; the feedback
    pipeline summarizes recordings into a reviewable issue before an agent acts
primitives:
- id: forge
  name: Forge
  desc: 'Custom harness: Slack bug discussion → Linear issue → drafted fix → PR pushed back for review'
  role: workflow
- id: mux
  name: Mux
  desc: One person coordinates coding agents with separate worktrees, branches, and terminals
  role: mechanism
- id: orchestrate-concurrent-agents
  name: Orchestrate concurrent agents
  desc: 'Separate Mux context: An engineer runs several agents in parallel, each on its own worktree, and reviews,
    gives feedback, and merges as each finishes'
  role: mechanism
key_metrics:
- id: users-including-engineers-pms-designers-active
  text: 'Mux: 600+ users including engineers, PMs, and designers (335 active, 197 power users)'
- id: prs-from-background-agents
  text: 5% of all PRs merged come from in-house background agents (Feb 2026)
- id: wallet-rewrite-pr-review-times-reduced
  text: Wallet rewrite PR review times reduced from 150 hours to 15 hours (self-reported; period and method not documented)
- id: speed-run-participants-opened-prs-minutes
  text: 'Speed run: about 100 participants opened about 70 PRs in 15 minutes (opened, not merged; single event)'
- id: merged-prs-repositories-orgs
  text: 'Mux: 5,068 merged PRs across 461 repositories and 10 orgs'
- id: users-show-more-merged-prs
  text: Mux users show 3.5x more merged PRs per engineer than baseline (39.6 vs 11.4); the post cautions users may skew
    toward already-high-output engineers
lessons_learned:
- id: engineers-use-mux-alongside-claude-code
  text: Coinbase engineers use Mux alongside Claude Code, OpenCode, Cursor, and other internal agents.
- id: stores-requirements-work-status-linear-slack
  text: Coinbase stores requirements and work status in Linear; its Slack workflow creates an issue before Forge drafts
    a fix.
- id: gives-concurrent-agents-separate-worktrees-branches
  text: Mux gives concurrent agents separate worktrees, branches, and terminals. This separates edits; it does not establish
    a security sandbox.
- id: security-requirements-prevented-using-available-cloud
  text: Coinbase reports that security requirements prevented it from using available cloud background agents and motivated
    its internal harness.
- id: slack-harness-giving-agents-same-tools
  text: Coinbase describes its Slack harness as giving agents the same tools and context as engineers, with a PR returned
    to the thread.
- id: chintan-turakhia-favors-demonstrations-shared-experiments
  text: Chintan Turakhia favors demonstrations and shared experiments for adoption, citing PR speed runs and a Cursor
    Wins channel.
