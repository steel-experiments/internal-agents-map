claim_metadata:
  operating_models.0:
    confidence: high
    confidence_reason: The sources describe delegated implementation that drafts a fix and pushes a pull request
      back to Slack for review; no source documents a build step.
    valid_at: '2026'
  lessons_learned.engineers-use-mux-alongside-claude-code:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Mux article explicitly describes a portfolio of tools in use. It does not compare that
      portfolio with a single-harness policy.
  lessons_learned.stores-requirements-work-status-linear-slack:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The workflow account names Linear as the record of work and traces the Slack message through
      issue creation to a PR returned for review.
  lessons_learned.gives-concurrent-agents-separate-worktrees-branches:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The source describes git and terminal separation but no access-control boundary between agents,
      so sandbox equivalence would be an unsupported inference.
  lessons_learned.security-requirements-prevented-using-available-cloud:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The episode writeup gives that constraint as the reason for the in-house build at the time
      of the interview.
    valid_at: 2026-03
  lessons_learned.slack-harness-giving-agents-same-tools:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The company post states the tools-and-context claim and the Slack-to-PR workflow, but supplies
      no tool-by-tool access comparison.
    valid_at: '2026'
  lessons_learned.chintan-turakhia-favors-demonstrations-shared-experiments:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The interview writeup attributes this preference to Turakhia and names the examples; it does
      not isolate their effect from other adoption work.
    valid_at: '2026'
  headline_metric:
    confidence: medium
    confidence_reason: Self-reported share stated by the engineering leader who built the harness; measurement method
      and period not documented. The preserved tweet says only 'all PRs merged'; no preserved reply establishes
      a company-wide scope.
    valid_at: 2026-02
    metric_scope: PRs merged by in-house background agents
    denominator: All PRs merged; the scope beyond engineering is not documented in the preserved capture
    category: adoption-output
    basis: reported-measurement
    subject: Share of all merged pull requests produced by in-house background agents
  key_metrics.users-including-engineers-pms-designers-active:
    metric_scope: Registered Mux users including engineers, PMs, and designers; 335 active and 197 power users
    category: adoption-output
    basis: reported-measurement
    subject: Registered Mux users including engineers, PMs, and designers, with active and power-user counts
  key_metrics.prs-from-background-agents:
    confidence: medium
    confidence_reason: Self-reported share stated by the engineering leader who built the harness; measurement method
      and period not documented. The preserved tweet says only 'all PRs merged'; no preserved reply establishes
      a company-wide scope.
    valid_at: 2026-02
    metric_scope: PRs merged by in-house background agents
    denominator: All PRs merged; the scope beyond engineering is not documented in the preserved capture
  key_metrics.wallet-rewrite-pr-review-times-reduced:
    confidence: low
    confidence_reason: The episode description states the reduction without a date, denominator, or measurement
      method.
    valid_at: 2026-03
    metric_scope: PR review times for the wallet rewrite effort
    category: cost-latency
    basis: reported-measurement
    subject: PR review times for the wallet rewrite effort
  key_metrics.speed-run-participants-opened-prs-minutes:
    confidence: medium
    confidence_reason: Described by the organizer as a single event; explicitly pull requests opened, not merged.
      The Linear customer story reports other sessions with different counts (120 engineers and 80 pull requests
      in the first session; over 500 pull requests in fifteen minutes in a later one).
    valid_at: 2026-03
    metric_scope: Pull requests opened during one speed-run session
    category: adoption-output
    basis: reported-measurement
    subject: Pull requests opened during one speed-run session
  key_metrics.merged-prs-repositories-orgs:
    confidence: medium
    confidence_reason: Coinbase reported the aggregate in its own engineering blog without independent verification
      or a measurement window.
    metric_scope: Mux merged pull requests across repositories and organizations
    category: adoption-output
    basis: reported-measurement
    subject: Mux merged pull requests across repositories and organizations
  key_metrics.users-show-more-merged-prs:
    confidence: medium
    confidence_reason: Self-reported comparison whose own text cautions that Mux users likely skew toward engineers
      who were already high-output and AI-forward; no cohort method is documented.
    metric_scope: Merged pull requests per engineer for Mux users compared with a baseline of non-users
    denominator: Engineers not using Mux at the time of the comparison (11.4 merged PRs)
    category: effectiveness
    basis: reported-measurement
    subject: Merged pull requests per engineer for Mux users compared with non-user baseline
page_content:
  version: 1
  reviewed_at: '2026-09-17'
  source_ids:
  - coinbase-forge-mux-source-1
  - coinbase-forge-mux-source-2
  - coinbase-forge-mux-source-3
  - coinbase-forge-mux-source-4
  - coinbase-forge-mux-source-5
  workflow_scope: Slack bug discussion → Forge issue, drafted fix and reviewed pull request
  questions:
    purpose:
      state: reported
    workflow:
      state: reported
      claim_paths:
      - primitives.forge
      note: The parallel-session Mux example remains in research details and has its own infrastructure record.
    human_involvement:
      state: reported
      claim_paths:
      - operating_models.0
      - primitives.orchestrate-concurrent-agents
      note: 'The documented checkpoint is the pull-request review: Forge pushes the PR back to Slack for review,
        and the orchestrating engineer reviews, gives feedback, and merges each parallel result.'
    implementation:
      state: reported
    validation:
      state: unreported
      note: No automated check of agent output is documented; the documented check is the human pull-request review
        cited with human involvement.
    observations:
      state: unreported
      note: The collected adoption metrics describe Mux, broader background agents or company experiments; they
        do not isolate Forge outcomes.
    lessons:
      state: reported
  implementation_fields:
    model:
      note: Multiple underlying models are stated; the documented portfolio spans harnesses, and no source names
        model providers.
    sandbox:
      state: unreported
      note: 'The sources describe separate git worktrees, branches, and terminals for concurrent agents in
        Mux, a separate platform; they do not establish this as the Forge execution environment.'
    credentials:
      state: unreported
      note: No capture documents credential handling for the agents; the security requirements that blocked cloud
        background agents are described without their mechanism.
    interfaces:
      note: Slack, GitHub, and Linear are named as invocation surfaces for Forge.
  aliases:
    key_metrics.prs-from-background-agents:
      duplicate_of: headline_metric
      reason: 'Identical statement, period, scope, and denominator as the headline: the same 5% share of merged
        PRs from the same tweet.'
