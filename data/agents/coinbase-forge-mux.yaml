id: coinbase-forge-mux
company: Coinbase
agent_name: "Forge / Mux"
year: 2026
status: internal
domains: [coding, code-review]
autonomy: drafts-reviewed
summary: "Forge turns a Slack/GitHub/Linear discussion into a Linear issue, fix, PR, and one-off build; Mux lets employees run many coding agents concurrently."
headline_metric: "Mux: 600+ users across Coinbase organizations (April 2026)"
architecture:
  sandbox: "Mux gives each concurrent agent its own git worktree, branch, and terminal"
  harness: "Portfolio approach — Claude Code, OpenCode, Cursor, and Copilot rather than one harness; Forge is a custom harness invokable from Slack, GitHub, and Linear"
  model: "Portfolio across multiple providers"
  interfaces: [slack, github, linear]
  tool_access: "Linear treated as the structured product context / source of truth"
  knowledge: "Linear as the durable structured-context layer for product work"
primitives:
  - { name: Forge, desc: "Custom harness: Slack bug discussion → Linear issue → fix → PR → one-off build" }
  - { name: Mux, desc: "Concurrency layer — one human coordinates many isolated coding agents, each in its own worktree/branch/terminal" }
key_metrics:
  - "Mux: 600+ users across Coinbase organizations (April 2026)"
lessons_learned:
  - "Support a portfolio of harnesses (Claude Code, OpenCode, Cursor, Copilot) rather than standardizing on one"
  - "Keep the system of record (Linear) as the agent's structured context — conversation can be the input, Linear stays durable"
  - "Simple per-agent worktree/branch/terminal isolation is a pragmatic alternative to full sandboxing for concurrent coding"
sources:
  - { title: "Coding had a concurrency problem: how Mux helped solve it", url: "https://www.coinbase.com/de/blog/coding-had-a-concurrency-problem-how-mux-helped-solve-it", type: "blog" }
  - { title: "Coinbase × Linear (Forge workflow)", url: "https://linear.app/customers/coinbase", type: "case-study" }
