claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The sources describe delegated implementation that drafts a fix and pushes a pull request
      back to Slack for review; no source documents a build step.
    valid_at: '2026'
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Mux article explicitly describes a portfolio of tools in use. It does not compare that
      portfolio with a single-harness policy.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The workflow account names Linear as the record of work and traces the Slack message through
      issue creation to a PR returned for review.
  lessons_learned.2:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The source describes git and terminal separation but no access-control boundary between agents,
      so sandbox equivalence would be an unsupported inference.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The episode writeup gives that constraint as the reason for the in-house build at the time
      of the interview.
    valid_at: 2026-03
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The company post states the tools-and-context claim and the Slack-to-PR workflow, but supplies
      no tool-by-tool access comparison.
    valid_at: '2026'
  lessons_learned.5:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The interview writeup attributes this preference to Turakhia and names the examples; it does
      not isolate their effect from other adoption work.
    valid_at: '2026'
  headline_metric:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Self-reported share stated by the engineering leader who built the harness; measurement method
      and period not documented. The preserved tweet says only 'all PRs merged'; no preserved reply establishes
      a company-wide scope.
    valid_at: 2026-02
    metric_scope: PRs merged by in-house background agents
    denominator: All PRs merged; the scope beyond engineering is not documented in the preserved capture
  key_metrics.0:
    metric_scope: Registered Mux users including engineers, PMs, and designers; 335 active and 197 power users
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Self-reported share stated by the engineering leader who built the harness; measurement method
      and period not documented. The preserved tweet says only 'all PRs merged'; no preserved reply establishes
      a company-wide scope.
    valid_at: 2026-02
    metric_scope: PRs merged by in-house background agents
    denominator: All PRs merged; the scope beyond engineering is not documented in the preserved capture
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: The episode description states the reduction without a date, denominator, or measurement
      method.
    valid_at: 2026-03
    metric_scope: PR review times for the wallet rewrite effort
  key_metrics.3:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Described by the organizer as a single event; explicitly pull requests opened, not merged.
    valid_at: 2026-03
    metric_scope: Pull requests opened during one speed-run session
  key_metrics.4:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Coinbase reported the aggregate in its own engineering blog without independent verification
      or a measurement window.
    metric_scope: Mux merged pull requests across repositories and organizations
  key_metrics.5:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Self-reported comparison whose own text cautions that Mux users likely skew toward engineers
      who were already high-output and AI-forward; no cohort method is documented.
    metric_scope: Merged pull requests per engineer for Mux users compared with a baseline of non-users
    denominator: Engineers not using Mux at the time of the comparison (11.4 merged PRs)
