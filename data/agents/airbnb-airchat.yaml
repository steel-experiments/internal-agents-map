summary: Airbnb's internal agentic-coding harness, built by its Dev AI team. Airchat is a wrapper over Claude
  Code with a unified gateway for cost and metrics, an internal plugin marketplace, AirDev Workspaces for
  parallel sessions, and more than a dozen internal MCP servers that connect agents to internal systems. The
  team abandoned an earlier from-scratch orchestrator and shipped a thin shim over Airchat instead.
headline_metric: About 64% of pull requests materialized through agentic coding
