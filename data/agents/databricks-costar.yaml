summary: Databricks runs internal engineering agents for work such as on-call support and automated code review.
  coSTAR ships and tests them, using LLM judges as the test suite and a coding assistant to refine the agent until
  the judges pass. Databricks' Omnigent is a separate product.
architecture:
  harness: coSTAR framework for shipping and testing internal agents
  knowledge: Private benchmark built from the Databricks multi-million line codebase
  interfaces: []
  tool_access: Internal agents call MCP tools for data access, code execution, and environment setup
primitives:
- name: Run the scenario against the agent under test
  desc: The coSTAR test harness sends each scenario prompt to the agent under test and captures the execution as
    an MLflow trace
- name: Score the trace with aligned judges
  desc: Agentic judges inspect the trace for properties such as code validity, best-practice adherence, and tool
    sequencing instead of asserting exact outputs
- name: Refine the agent until the judges pass
  desc: A coding assistant reads judge failures, diagnoses root causes, and patches the agent while the engineer
    remains the reviewer and final arbiter of the proposed changes
- name: Align judges against a human-graded Golden Set
  desc: Judge alignment refines the judges against a Golden Set of engineer-assessed outputs using MLflow alignment
    techniques
- name: Run the judges in production and CI
  desc: The same judges run on production traffic, in CI/CD pipelines, and on nightly builds to catch regressions
    from agent or infrastructure changes
key_metrics:
- coSTAR reduced the time to verify agent changes from two weeks down to hours
- Private benchmark built from a multi-million line codebase
lessons_learned:
- 'Give judges tools, not traces: Databricks reports that agentic judges which call targeted tools on a trace scale
  better than feeding the full trace into a model'
