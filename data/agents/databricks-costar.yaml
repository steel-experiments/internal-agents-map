summary: Databricks' internal engineering agents and the coSTAR framework that ships and tests them.
  Databricks uses internal agents as daily coding drivers on its own codebase, including code-review and
  on-call support work. coSTAR tests agents on a private benchmark built from Databricks' multi-million line
  codebase before they ship. Omnigent is a separate shipping open-source product and is excluded from this
  record.
