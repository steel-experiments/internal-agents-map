claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The article documents agent auto-approve for low-risk pull requests in opted-in areas and risk classification that routes high-risk changes to stricter review; the run-time exception path is not described. The harness-engineering post corroborates agent automerge of low-friction pull requests in one repository but describes no risk tiering, so the routing mechanism itself stays single-sourced."
    valid_at: "2026-09"
  operating_models.1:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: "Pipeline step 6 states that a human approves a change to go to production before the deploy agent takes over."
    valid_at: "2026-09"
  operating_models.2:
    kind: inference
    provenance: catalog-judgment
    confidence: unverified
    confidence_reason: "The article documents Perf Factory only up to agents that de-duplicate signals, identify real latency regressions, root-cause them, and propose fixes; whether a human reviews, applies, or lands those proposals is not stated."
    valid_at: "2026-09"
  headline_metric:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: "Company usage claim relayed by an independent reporter; no method or denominator published. OpenAI's own 2026-09-10 launch post states nearly 100% of teams inside OpenAI, including finance and sales, use ChatGPT Work and Codex (a teams denominator, not employees)."
    valid_at: "2026-09"
    reported_by: OpenAI
    metric_scope: Weekly Codex and ChatGPT Work use across OpenAI employees
    measurement_method: Internal token-usage tracking by department, chart sourced to OpenAI
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: "Company adoption figures relayed by an independent reporter; the four-month window carries no calendar dates. OpenAI's launch post corroborates finance-org use (month-end close reduced from days to hours) but not the 0%-to-90% trajectory."
    valid_at: "2026-09"
    reported_by: OpenAI
    metric_scope: Weekly Codex use in non-engineering orgs such as finance, recruitment, and legal
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: "A VP of Engineering load estimate relayed by an independent reporter."
    valid_at: "2026-09"
    reported_by: OpenAI
    metric_scope: Load on build-test-deploy pipeline systems
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: "OpenAI's own figure relayed by press at DevDay 2025; no method or denominator published."
    valid_at: "2025-10"
    reported_by: OpenAI
    metric_scope: Daily Codex use by OpenAI technical staff in October 2025
  key_metrics.3:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: "OpenAI's own figure relayed by press at DevDay 2025; the comparison group and counting method are not stated."
    valid_at: "2025-10"
    reported_by: OpenAI
    metric_scope: Weekly pull requests completed by OpenAI engineers using Codex, relative to unstated baseline
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The article does not document an execution sandbox; unknown does not mean absent."
  architecture.model:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The article names no underlying models for the internal harness; unknown does not mean absent."
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: high
    confidence_reason: Andrew Ambrosino offers this explanation in the reported interview. The adoption timeline
      does not isolate the effect of longer runs from other product changes.
  lessons_learned.1:
    kind: opinion
    provenance: reported
    confidence: high
    confidence_reason: Ambrosino describes teams distributing workflows and explains why a generic agent alone
      was insufficient; this is his adoption assessment.
