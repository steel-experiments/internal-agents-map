# yaml-language-server: $schema=../agent.schema.json
id: openai-software-factory
company: OpenAI
agent_name: Agentic software factory
approach_type: agent-system
deployment_stage: scaled
year: 2026
first_public_evidence:
  date: "2025-10-09"
  source_id: venturebeat-devday-codex
last_reviewed_at: "2026-09-16"
status: internal
domains:
- coding
- code-review
- ci-triage
- ops
autonomy: human-in-loop
operating_models:
- scope: "low-risk pull request -> merge in opted-in codebase areas"
  attention_boundary: exception-only
- scope: "code change -> production rollout on the general path"
  attention_boundary: work-product-review
- scope: "production alert -> proposed performance fix"
  attention_boundary: unknown
rubric:
  invocation:
  - interactive
  - background
  - scheduled
  - event-driven
  state: durable-session
  identity: unknown
  evidence_strength: mixed
summary: An agent system built around OpenAI's internal Codex. A person defines the task; coding agents implement
  it and respond to CI results; specialist agents review changes under risk-based routing. A human approves
  production deployment before an agent manages the rollout and monitors its results.
headline_metric: Almost all OpenAI employees used Codex and ChatGPT Work weekly as of
  the September 2026 report (self-reported).
architecture:
  sandbox: unknown
  harness: Internal Codex, described as much more advanced than the external product
    because it is plugged into almost every OpenAI system; ChatGPT Work runs on the
    same harness
  model: unknown
  interfaces:
  - desktop
  - cli
  - slack
  - github
  - skill
  tool_access: Git repositories and GitHub, Slack, Notion, Databricks, Datadog, and
    internal logs and data sources
  knowledge: OpenAI moved its documentation inside the source code; internal Codex
    skills, some maintained by Codex itself; new engineers are directed to ask Codex
    during onboarding
  context_mgmt: The /goal setting lets an agent work until a goal is complete; threads
    run for days and spin off other agents
primitives:
- name: Domain-specialist review agents
  desc: Multiple agents, each configured as a domain specialist, review every change;
    the article compares this to a review by a domain expert from each relevant
    infrastructure team
- name: Risk-tiered review routing
  desc: Changes are classified by risk; high-risk changes can trigger more agent
    reviews or a mandated human review, while opted-in low-risk areas use an agent
    that auto-approves pull requests
- name: Per-change deploy agent
  desc: After human approval for production, an agent manages the rollout, builds a monitoring dashboard, and
    watches signals of success or failure
- name: Perf harness with Synthetics A/B
  desc: A perf harness sends problematic pull requests to the Synthetics A/B framework
    to evaluate performance implications
- name: Perf Factory
  desc: Agents sift through alerts and dashboards, de-duplicate signals, identify real
    latency regressions, root-cause them, and propose fixes
- name: Implement and babysit the pull request
  desc: Codex makes code changes toward the goal, builds and tests, and babysits the
    pull request by fixing CI failures until it is green
key_metrics:
- Non-engineering orgs such as finance, recruitment, and legal went from about 0% to
  90% Codex usage within a four-month period (self-reported)
- Some build-test-deploy systems saw about a 10x load increase within roughly six
  months (self-reported)
- 92% of OpenAI technical staff used Codex daily, as reported at DevDay in October 2025
- Engineers using Codex completed 70% more pull requests each week, as reported at
  DevDay in October 2025
lessons_learned:
- OpenAI's desktop lead attributes some adoption growth to longer-running tasks and an agent that coordinates
  sub-agents.
- OpenAI's desktop lead says role-specific and team-specific plugins helped people adapt agents to their work.
