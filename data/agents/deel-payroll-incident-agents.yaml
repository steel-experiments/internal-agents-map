claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The post reports that the retry stage clears about 55% of failures and that those cases
      self-resolve without anyone touching them, which places human attention at the exception only. Deel does not
      say who watches the retries or whether a failed retry ever pages someone directly.
    valid_at: '2026-08'
  operating_models.1:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The post says the remaining cases still reach an engineer and arrive as a 30-second review
      with the exact fix command, so a person reviews the work product before it takes effect. The post does not
      say whether an engineer may also reject or edit the proposed command.
    valid_at: '2026-08'
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The post names Akai as the platform the pipeline runs on but documents no execution isolation
      boundary; unknown does not mean absent.
  headline_metric:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: Deel reports the annual figure in its own marketing-adjacent blog as a single table row with
      no measurement window, no case count, and no method for converting saved triage time into annual hours.
    valid_at: '2026-08'
    value: 900
    unit: engineering hours per year
    reported_by: Deel
    metric_scope: Engineering hours Deel reports it no longer spends investigating failed US PEO payroll syncs
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Deel reports the before-and-after pair in its own blog. The 45 minutes matches the narrative
      description of the old triage, and the under-10-seconds figure matches the parallel-fetch description, but
      no sample, date range, or timing method is given.
    valid_at: '2026-08'
    reported_by: Deel
    metric_scope: Time to triage one failed US PEO payroll sync, before and after the pipeline
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: Deel reports both the 0% to 55% table row and the matching prose, and separately reports
      that about 55% of failures were transient, which makes the number internally consistent. It is self-reported
      and the counting period is not given.
    valid_at: '2026-08'
    reported_by: Deel
    metric_scope: Share of failed US PEO payroll syncs resolved without an engineer, before and after the pipeline
    denominator: All failed US PEO payroll syncs the pipeline picks up
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: Both sides of this comparison are ranges rather than counts, the post gives no measured peak
      day, and 20+ cases is an open-ended figure.
    valid_at: '2026-08'
    reported_by: Deel
    metric_scope: Failed payroll sync cases handled during a peak hiring period, before and after the pipeline
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The post states the sequential-stage and parallel-fetch design and gives the 40-second to
      10-second comparison as the result. The comparison is Deel's own and carries no measurement method.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The post names the structured failure taxonomy and states that adding a category is a
      one-line prompt change. It does not show the prompt or say how a new category is tested.
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The post states the JSON-in, JSON-out handoff and the absence of shared state as a design
      choice. It reports no failure mode this choice avoided in production.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The post states the retry-first ordering and gives Deel's reason, that a retry on a payroll
      record is only safe once the diagnosis runs anyway. It does not report a case where a retry compounded a
      structural failure.
  lessons_learned.4:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: This is Deel's own generalization of its result, stated in the closing section of a post
      that also markets the Deel platform. The post names no second workflow at Deel or elsewhere that runs the
      pattern, so the transfer is asserted rather than shown.
