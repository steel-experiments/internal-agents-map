summary: An event-driven AI code reviewer for Uber's internal review platform that generates, grades, filters, deduplicates,
  and posts findings while leaving engineers in control of the reviewed change.
headline_metric: Reviews over 90% of Uber's approximately 65,000 weekly diffs, with over 75% reported usefulness and
  over 65% of posted comments addressed
architecture:
  harness: A prompt-chained pipeline separates comment generation, confidence grading, validation, semantic deduplication,
    and category filtering; three specialized assistants were in operation when published
  model: Periodic benchmark evaluation; Claude 4 Sonnet as generator with o4-mini-high as grader was the highest-F1
    reported pairing
  interfaces:
  - internal-ui
  - ci
  tool_access: Reviews eligible code in Uber's six monorepos across Go, Java, Android, iOS, TypeScript, and Python;
    richer internal artifacts were not yet connected when published
  knowledge: Surrounding source context plus a shared registry of Uber-specific coding and style rules
  context_mgmt: Comments and metadata are streamed through Kafka to Hive for feedback analysis, experiments, and
    operational dashboards
primitives:
- name: Specialized assistants
  desc: Standard, best-practices, and AppSec reviewers generate findings for different issue classes
- name: Multi-layer quality filtering
  desc: Confidence grading, semantic deduplication, and historically low-value category suppression reduce noise
- name: Production feedback loop
  desc: Developer ratings, addressed-comment detection, and a curated benchmark tune prompts, thresholds, and models
key_metrics:
- Reviews over 90% of approximately 65,000 weekly diffs
- Over 75% of comments rated useful by engineers who interact with the tool
- Over 65% of posted comments addressed in the same changeset
- Median review latency of 4 minutes across all six Uber monorepos
- Approximately 1,500 developer hours reportedly saved per week, based on an assumed 10-minute second review per
  processed commit
lessons_learned:
- Prefer fewer high-confidence findings over high comment volume
- Combine prompts with deterministic filtering, deduplication, evaluation, and feedback instrumentation
- Roll out gradually by team and assistant while tracking precision, recall, usefulness, and false positives
