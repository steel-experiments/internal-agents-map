claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: high
    confidence_reason: The source describes AI-generated review findings while engineers remain in control of the
      change.
    valid_at: '2025-08-12'
  headline_metric:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: The opening paragraph reports approximately 65,000 weekly diffs, but the cost discussion
      says 65,000 per month. These conflicting periods remain unresolved; neither is independently verified.
    valid_at: 2025-08
    reported_by: Uber
    metric_scope: Introduction's reported weekly diff coverage, plus comment usefulness/addressed rates; later paragraph's
      monthly period conflicts and remains unresolved
    denominator: Introduction reports approximately 65,000 weekly diffs; cost paragraph says monthly. Usefulness
      covers rated comments; addressed rate covers posted comments
    measurement_method: Production coverage, developer ratings, and automatic addressed-comment detection
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: low
    valid_at: 2025-08
    reported_by: Uber
    metric_scope: Introduction's reported weekly diffs analyzed; monthly period in the cost paragraph conflicts
      and remains unresolved
    denominator: Approximately 65,000 weekly diffs according to the introduction; same volume described as monthly
      in the cost paragraph
    confidence_reason: The opening paragraph reports approximately 65,000 weekly diffs, but the cost discussion
      says 65,000 per month. These conflicting periods remain unresolved; neither is independently verified.
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    valid_at: 2025-08
    reported_by: Uber
    metric_scope: Comments rated useful by engineers who provide feedback
    denominator: Comments with engineer interaction
    measurement_method: Useful / Not Useful rating links
  key_metrics.2:
    kind: metric
    provenance: reported
    confidence: medium
    valid_at: 2025-08
    reported_by: Uber
    metric_scope: Posted comments considered addressed in the same changeset
    denominator: Posted comments
    measurement_method: Five reruns on the final commit and semantic-similarity matching
  key_metrics.3:
    kind: metric
    provenance: reported
    confidence: medium
    valid_at: 2025-08
    reported_by: Uber
    metric_scope: Reviews across all six Uber monorepos
    measurement_method: Production latency telemetry
  key_metrics.4:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: The source estimates about 1,500 hours using over 10,000 commits and a 10-minute assumption;
      the rounded figures do not arithmetically reconcile exactly and are not observed time savings.
    valid_at: 2025-08
    reported_by: Uber
    metric_scope: Processed commits excluding configuration files; modeled second-review time savings
    denominator: Over 10,000 commits per week
    measurement_method: Processed commits multiplied by an assumed 10 minutes for a second human review
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: high
    confidence_reason: The precision section describes confidence ratings, category pruning, and duplicate removal.
      The preference is specific to uReview's reported feedback.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: The guardrail and feedback sections name those stages and the rating and addressed-comment
