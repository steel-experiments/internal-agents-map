summary: Deflaker investigates and repairs flaky tests for Dropbox engineers using Nova.
architecture:
  harness: Durable remediation workflow calling Nova; publication and CI remain outside the coding agent.
  context_mgmt: Prior attempt notes and new test logs accompany retries.
primitives:
- name: Collect evidence
  desc: Athena identifies flakiness; Deflaker gathers passing and failing logs.
- name: Propose a repair
  desc: Nova diagnoses the likely cause and proposes a change.
- name: Validate repeatedly
  desc: CI repeats the test at least 100 times, depending on its failure rate.
- name: Retry or finish
  desc: Failed validation starts another attempt with new logs and prior notes; the workflow lands a fix or stops
    after five attempts.
