id: monday-sphera-atlas-morphex
company: monday.com
agent_name: Sphera / Atlas / Morphex
approach_type: agent-system
deployment_stage: scaled
year: 2026
first_public_evidence:
  date: '2026'
  source_id: monday-sphera-atlas-morphex-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- coding
- code-review
autonomy: autonomous
operating_models:
- scope: Morphex feature task → PR passing CI, remote sandbox, and Guardrails → automatic merge and production
    ship
  attention_boundary: exception-only
- scope: Atlas feature task → sandbox-tested pull request (confidence-scored auto-merge above threshold, human
    routing below)
  attention_boundary: unknown
rubric:
  invocation:
  - event-driven
  - interactive
  state: mixed
  identity: dedicated-agent
  evidence_strength: secondary-only
summary: An internal agent system on Amazon Bedrock with agent identities, assigned managers, and evaluation
  scores. Atlas prepares feature changes; Morphex can merge and ship changes that pass the required checks
  without human review.
headline_metric: 'Morphex: 19 of 20 PRs merge without human review'
architecture:
  sandbox: Amazon EKS, one pod per active session; a remote sandbox tests each PR before review; EFS workspace mount
  harness: Claude Agent SDK behind a thin monday-agent-sdk wrapper (provider neutrality, cold-start optimization,
    custom harness opinions)
  model: Amazon Bedrock; Application Inference Profiles for routing; cross-region failover; PrivateLink (traffic
    stays in VPC)
  interfaces:
  - slack
  - monday
  - github
  tool_access: Triggers via Slack @mention, monday item assignment, or GitHub PR review → SNS → per-team SQS → consumers;
    monday MCP servers underpin the Guardrails
  knowledge: 'File-based memory: MEMORY.md (cross-session) + diary/YYYY-MM-DD.md; sessions/repos/secrets on EFS;
    durable records on S3'
  credentials: Per-session secrets in AWS Secrets Manager; same RBAC as humans; real Slack/GitHub/monday accounts
  context_mgmt: Live state in ElastiCache (sub-ms); monday boards (Builders CoWORK) as shared state for tasks, status,
    handoffs
primitives:
- name: Agent profiles
  desc: Stable identity + assigned human manager + scope + performance score
- name: PR Guardrails
  desc: Automated review against monday standards (metrics, feature flags, security)
- name: Memory as files
  desc: MEMORY.md + daily diary instead of vector retrieval
- name: Builders CoWORK
  desc: monday boards as the shared-state layer for human/agent collaboration
- {name: Receive a task from one of three inboxes, desc: 'A Slack @mention, monday item assignment, or GitHub PR
    review request lands in the same agent session through SNS and a per-team SQS queue'}
- {name: Implement the feature task, desc: 'The agent picks up tickets, writes the PR, and ships the feature from
    the same backlog as human teammates'}
- {name: Auto-deploy the PR to a remote sandbox, desc: 'Every PR auto-deploys to a per-session remote sandbox; tests,
    checks, and replayed production traffic run before any human review'}
- {name: Merge above the confidence threshold, desc: 'PRs above the confidence-score threshold merge automatically
    after passing every gate and ship to production with no human in the loop; below-threshold PRs route to a human
    with the failing signal named'}
key_metrics:
- 'Morphex: 19 of 20 PRs merge automatically without human review'
- 90% of Builders use AI coding tools monthly; adoption nearly doubled year over year
- Per-engineer PR throughput increased by more than 50%
- Guardrails catches ~25% of agent PRs before human review; low single-digit revert rate
lessons_learned:
- monday.com says it introduced evaluations too late, after growing PR volume made informal review inadequate.
- monday.com replaced unsuccessful transcript retrieval experiments with per-agent MEMORY.md files and daily
  diaries read at session start.
- monday.com added remote sandbox checks and production-traffic replay after Atlas changes passed local tests
  but failed in CI.
- Morphex uses the same repository, CI, Guardrails checks, and revert protocols as monday engineers.
- monday.com uses blocking automated reviewers for engineering standards and feeds evaluation results back
  into the agent harness.
