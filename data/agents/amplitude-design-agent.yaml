summary: "Amplitude built Design Agent, an internal web tool that anyone in the company reaches behind Google OAuth to turn a text prompt, a screenshot, or a rough product idea into on-brand HTML output. Amplitude's brand guidelines and design-system tokens sit in the agent system prompt, so the output reads as the company's own. The tool began as a proof of concept for product and engineering teams and has expanded to other designers, marketers, and creative teams."
headline_metric: "Over 2,219 session snapshots in Design Agent's first few weeks, with repeat usage across multiple teams (self-reported)"

architecture:
  sandbox: unknown
  harness: "Claude Managed Agents supplies reasoning, tool use, and multi-step generation; Amplitude wrote no state machine, prompt chain, or tool-calling logic. A thin wrapper of Cloudflare Workers serves the web interface and the agent interaction endpoint."
  model: "Claude, through Claude Managed Agents; no model version is named."
  interfaces: [web]
  tool_access: "Amplitude states that it defined the agent's tools and context but does not name them. Generated artifacts are written to Cloudflare R2, each with a permanent URL."
  knowledge: "A structured Markdown document in the Google design.md format holds Amplitude's brand guidelines, color system, typography rules, spacing conventions, and component patterns."
  context_mgmt: "The brand and design-system document is baked into the agent system prompt, so it is present in every conversation; behavior changes ship by editing that prompt and take effect in minutes."

primitives:
  - name: "Prompt or screenshot to on-brand HTML artifact"
    desc: "A text prompt, a screenshot, or a rough product idea becomes interactive HTML styled to the Amplitude design system."
  - name: "Submit the request in the web interface"
    desc: "The interface offers a text input, an option to upload a screenshot or reference image, and a panel that displays the generated artifact."
  - name: "Let the managed agent plan and generate"
    desc: "Claude Managed Agents reasons about the prompt, runs a multi-step plan, handles tool-call follow-ups, and assembles the final artifact."
  - name: "Persist the artifact with a stable URL"
    desc: "Every generated artifact lands in Cloudflare R2 with a stable, permanent URL, and users keep a visible generation history."
  - name: "Share, iterate, or carry the output forward"
    desc: "People share the output links in Slack threads, return to generate follow-ups on previous outputs, or copy the generated HTML into a coding agent."
  - name: "Bake brand context into the system prompt"
    desc: "Amplitude's design philosophy and design-system tokens are written into the system prompt, which Amplitude reports turned generic model output into output that reads as its own."
  - name: "Instrument every session and turn failures into regression tests"
    desc: "Amplitude tracks every session, output, and tool call with its own analytics, reviews sessions to find failure patterns, and creates eval examples from the worst outputs as regression tests before updating skills files, prompts, and agent configuration."

key_metrics:
  - "Amplitude reports roughly 2-4x more viewers than makers for generated artifacts, which it reads as a signal that outputs are shared beyond the people who generate them"
  - "Amplitude reports a working Design Agent for its product and engineering teams two days after starting, on Claude Managed Agents and Cloudflare"

lessons_learned:
  - "Amplitude wrote its brand guidelines and design-system tokens into the agent system prompt and reports that the difference from generic model output was drastic; this is its own result for one internal design tool, not a measured comparison."
  - "Amplitude instruments Design Agent with its own product analytics, reviews sessions to find failure patterns, and turns the worst outputs into eval examples that act as regression tests."
  - "Amplitude reports that managed agent orchestration and serverless hosting left it with no servers, monitoring, autoscaling, or database to run, which suits an internal tool maintained by one person."
  - "Will Newton concludes that agents are products needing repeated iteration with real users, and advises keeping the stack simple and not skipping instrumentation; this is his stated view from building this one internal tool."

