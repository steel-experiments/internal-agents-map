    value: 2219
    unit: "session snapshots"
    reported_by: Amplitude
    metric_scope: "Design Agent session snapshots across Amplitude teams in the first few weeks of use, as reported in the May 2026 post"
    denominator: "None reported; the post gives no user, team, or session total to divide by"
    measurement_method: "Amplitude product analytics instrumented on Design Agent, which the post says tracks every session, output, and tool call"
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: "The post gives the ratio as roughly 2-4x with no period, no counting rule for a viewer or a maker, and no underlying totals, so the range is an approximation rather than a stated measurement."
    valid_at: "2026-05"
    reported_by: Amplitude
    metric_scope: "Viewers of generated Design Agent artifacts compared with the people who generated them"
    denominator: "None reported"
    measurement_method: "Not stated; the post reports the ratio without a counting rule"
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: "The author states the two-day figure twice as elapsed build time for the first working version; it describes implementation effort rather than a performance result, and no start date or effort total is given."
    valid_at: "2026-05"
    reported_by: Amplitude
    metric_scope: "Elapsed time from starting the build to a working Design Agent for Amplitude product and engineering teams"
    denominator: "Not applicable"
    measurement_method: "Not stated; the author reports the duration without a record of hours or a defined start"
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: "The post says Claude Managed Agents handles execution behind the scenes but names no execution isolation boundary for the agent's work; unknown records the gap, not an absent sandbox."
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "The post describes the design.md context document and the system-prompt change as steps the team took, and calls the difference drastic; that judgment is the author's own, with no side-by-side evaluation."
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: high
    confidence_reason: "The measurement section states the practice directly: sessions reviewed in Agent Analytics for failure patterns, eval examples created from the worst outputs as regression tests, then skills files, prompts, and configuration updated."
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: "The hosting section states the absence of servers, monitoring, autoscaling, and a database and ties it to a one-person internal tool; this is the team's own description of its setup, not an audited operating record."
  lessons_learned.3:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: "The closing section is the author's stated conclusion from this one build; he offers no comparison with other agents, so the advice is attributed rather than established."

