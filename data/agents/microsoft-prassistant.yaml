summary: Microsoft's internal AI-powered code review assistant, built in close collaboration with its Developer
  Division's Data & AI team. It joins each pull request as a reviewer, summarizes the change, and comments on
  specific lines with suggested edits the author applies. Microsoft says it shaped GitHub's Copilot code review.
headline_metric: Supports more than 90% of Microsoft PRs, impacting over 600,000 pull requests per month
architecture:
  interfaces: []
  knowledge: Repository-specific guidelines and custom review prompts can guide specialized reviews
primitives:
- {name: Automatic first review, desc: Creating a pull request can automatically start the assistant as a reviewer}
- {name: Review and summarize, desc: "The assistant reviews the diff, writes a pull-request summary, and posts categorized findings on specific lines"}
- {name: Suggest changes, desc: For a bug or suboptimal pattern, the assistant proposes a code snippet or alternative implementation}
- {name: Author decision, desc: "The author reviews, edits, and explicitly applies a suggestion; the assistant does not commit it directly"}
- {name: Pull-request Q&A, desc: Reviewers can ask the assistant questions in the pull-request discussion and receive answers about the code}
key_metrics:
- More than 90% of pull requests across the company
- More than 600,000 pull requests impacted per month
- About 5,000 repositories in early onboarding
- 10–20% median pull-request completion-time improvement in an early 5,000-repository cohort
