summary: Uber runs an internal coding agent that writes complete code changes with no human authoring, and engineers review
  and approve them. Its CTO reports that engineers now delegate tasks to the agent rather than accept its suggestions, and
  that its share of all code changes has grown from under 1%.
headline_metric: ~1,800 complete code changes per week (~8% of changes)
architecture:
  sandbox: unknown
  harness: Not specified publicly
primitives:
- {name: Delegate the task, desc: Engineers delegate coding tasks to the agent rather than accepting its suggestions}
- {name: Write the complete change, desc: The agent writes the entire code change with zero human authoring}
- {name: Review and approve, desc: An engineer reviews and approves the agent-written change}
key_metrics:
- ~1,800 complete code changes per week (~8% of changes at the time)
- 95% of engineers use AI tools monthly
lessons_learned:
- Uber's CTO describes the engineer's role shifting from writing every line to architecting systems and
  reviewing AI-generated code.
- Uber's CTO attributes the strongest adoption to engineers quietly experimenting, not to a top-down push.
