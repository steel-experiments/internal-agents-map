claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: >-
      The post places human attention at two points of a normal run: an engineer confirms the exploration
      strategy and GPU compute cost before any plan executes, and humans make strategic decisions and final
      approvals on the resulting proposals. Engineers are described as giving periodic oversight rather than
      continuous monitoring, and routine failures are handled inside the guardrails, so attention does not
      return at each experiment round or at the level of individual training configurations. The post never
      says humans are involved only when the agent raises an exception, so the boundary does not reach
      exception-only. The documented unattended runtime of days to weeks is a separate property and does not
      move the boundary. The post also states it covers only the ML experimentation capability, so this
      assessment does not extend to other REA capabilities.
    valid_at: '2026-03'
  architecture.sandbox:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: >-
      The post names Meta internal job schedulers, access controls granted by preflight checklist review, and
      a codebase restriction, but no execution isolation boundary for the agent; unknown does not mean absent.
  headline_metric:
    kind: metric
    provenance: reported
    confidence: medium
    confidence_reason: >-
      Meta reports the result in its own engineering blog with a stated denominator of six models and a
      stated comparison against baseline approaches, but does not define the accuracy measure, give absolute
      values, identify the baseline approaches, or cite an independent review.
    valid_at: '2026-03'
    reported_by: Meta
    metric_scope: Average model accuracy of REA-driven iterations in the first production validation
    denominator: A set of six ads ranking models
    measurement_method: >-
      Comparison of REA-driven iterations against baseline approaches; the accuracy measure is not defined
  key_metrics.0:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: >-
      The 5x label is a ratio derived from a staffing comparison rather than a measured throughput: Meta sets
      three engineers across eight models against a stated historical norm of two engineers per model. No
      time period, matched baseline measurement, or control for model difficulty is reported, and the output
      counted is proposals to launch improvements rather than launched improvements.
    valid_at: '2026-03'
    reported_by: Meta
    metric_scope: Engineer staffing for model-improvement proposals produced with REA
    denominator: Eight ads ranking models staffed by three engineers
    measurement_method: >-
      Ratio derived from a stated historical staffing norm of two engineers per model; no measured baseline
      throughput is reported
  key_metrics.1:
    kind: metric
    provenance: reported
    confidence: low
    confidence_reason: >-
      Meta reports a rise from one to five model-improvement proposals per early adopter in its own
      engineering blog. The interval is given only as the same time frame, the number of early adopters is
      not stated, and proposal quality or acceptance is not assessed.
    valid_at: '2026-03'
    reported_by: Meta
    metric_scope: Model-improvement proposals per early adopter using REA
    measurement_method: >-
      Self-reported before-and-after proposal count over an interval described only as the same time frame
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: >-
      The resilience section states that REA consults a runbook of common failure patterns, makes
      prioritization decisions, and debugs preliminary infrastructure failures instead of waiting for human
      intervention, and that engineers provide periodic oversight. The post reports the design; it gives no
      escalation rate or measurement of how often the guardrails held.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: >-
      The safeguards paragraph names the codebase restriction, the preflight checklist access grant, and the
      up-front compute budget confirmation with halting or pausing at the threshold. These are stated
      controls; the post does not describe how they are enforced or audited.
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: >-
      The hypothesis-generation section states that synthesizing the historical insights database with the ML
      research agent surfaces configurations unlikely to emerge from any single approach, and that the most
      impactful improvements combined architectural optimizations with training-efficiency techniques. The
      attribution is Meta's own and rests on no reported comparison against a single-source baseline, so the
      lesson stays bounded to the reported ads ranking case.
  lessons_learned.3:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: >-
      The closing section states the team's own position on how ML engineering should be structured, with
      agents handling iterative mechanics and humans making strategic decisions and final approvals. It is an
      attributed preference about the direction Meta is taking, not a measured outcome or a general
      recommendation.

