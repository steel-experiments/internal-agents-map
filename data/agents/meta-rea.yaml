summary: >-
  Meta built the Ranking Engineer Agent (REA) to run machine learning experimentation for its ads ranking
  models. REA generates hypotheses from a historical experiment database and a deep ML research agent,
  proposes an exploration strategy and GPU compute budget that an engineer confirms, then launches training
  jobs, debugs failures, and iterates across workflows that span days to weeks, hibernating while a job runs
  and waking when it completes. Engineers confirm the plan and approve the resulting improvement proposals.
headline_metric: "REA-driven iterations doubled average model accuracy over baseline approaches across six ads ranking models in the first production validation (self-reported, March 2026)."

architecture:
  sandbox: unknown
  harness: >-
    Built on Confucius, an internal Meta AI agent framework for complex, multistep reasoning that supplies
    code generation and an SDK for integrating with Meta internal tooling; REA itself splits into a REA
    Planner and a REA Executor over a shared skill, knowledge and tool system, with the executor running an
    agent loop and a wait state
  tool_access: >-
    Integrates through the Confucius SDK with Meta internal job schedulers, experiment tracking
    infrastructure, and codebase navigation tools; launches and manages training jobs and works exclusively
    on the Meta ads ranking model codebase under engineer-granted access controls and a confirmed compute
    budget
  knowledge: >-
    A curated historical insights database of past experiments supports in-context learning across prior
    successes and failures; a dedicated experiment logger writes outcomes, key metrics, and configurations
    into a centralized hypothesis experiment insight database that both the deep ML research agent and the
    hypothesis generator read
  context_mgmt: >-
    A hibernate-and-wake mechanism delegates the wait for a training job to a background system, shuts the
    agent down to conserve resources, and resumes it where it left off when the job completes; REA maintains
    persistent state and memory across multiround workflows spanning days or weeks

primitives:
- name: REA Planner and REA Executor over a shared skill, knowledge and tool system
  desc: >-
    The planner builds a detailed experiment plan with an engineer, the plan is exported to the executor,
    which manages asynchronous job execution through an agent loop and wait state, and a shared skill,
    knowledge and tool system supplies ML capabilities, historical experiment data, and integrations with
    Meta internal infrastructure
- name: Generate hypotheses from two sources
  desc: >-
    REA consults a curated historical insights database of past experiments and a deep ML research agent
    that investigates baseline model configurations, then synthesizes both to surface configurations
    unlikely to emerge from either source alone
- name: Agree the exploration strategy and compute budget with an engineer
  desc: >-
    Before executing any plan REA proposes a detailed exploration strategy, estimates total GPU compute
    cost, and confirms the approach with an engineer
- name: Run the three-phase plan
  desc: >-
    Validation tests individual hypotheses from different sources in parallel to establish quality
    baselines, combination merges promising hypotheses to search for synergistic improvements, and
    exploitation explores the most promising candidates aggressively within the approved compute budget
- name: Hibernate during a training run and wake when the job completes
  desc: >-
    When REA launches a training job it delegates the wait to a background system, shuts down to conserve
    resources, and automatically resumes where it left off when the job completes, so workflows continue
    across extended time frames without constant human monitoring
- name: Log each experiment back into the insight database
  desc: >-
    A dedicated experiment logger records outcomes, key metrics, and configurations into the centralized
    hypothesis experiment insight database, and the hypothesis generator draws on those insights to propose
    hypotheses for each subsequent round
- name: Screen failed runs and adapt within predefined guardrails
  desc: >-
    REA consults a runbook of common failure patterns, applies prioritization logic such as excluding jobs
    with clear out-of-memory errors or training instability signals such as loss explosions, debugs
    preliminary infrastructure failures from first principles, and halts or pauses runs when a compute
    threshold is reached, rather than surfacing routine interruptions to engineers

key_metrics:
- Three engineers delivered proposals to launch improvements for eight models, work Meta says historically
  required two engineers per model; Meta labels this a 5x engineering output gain.
- Meta reports that early adopters increased their model-improvement proposals from one to five in the same
  time frame.

lessons_learned:
- "Meta keeps engineers out of routine failure handling on REA: the agent consults a runbook of common
  failure patterns and adapts within predefined guardrails, and engineers provide periodic oversight rather
  than continuous monitoring."
- "Meta bounds the agent by scope and budget: REA works exclusively on the ads ranking model codebase,
  engineers grant explicit access controls through preflight checklist reviews, and REA confirms compute
  budgets up front and halts or pauses runs when a threshold is reached."
- For Meta ads ranking, pairing a historical experiment database with a deep research agent surfaced
  configurations that Meta says neither source produced alone, and the most impactful improvements combined
  architectural optimizations with training-efficiency techniques.
- The Meta team holds that agents should handle the iterative mechanics of ML experimentation while engineers
  move toward hypothesis direction, architectural decision-making, and final approvals.

