  desc: Capabilities separated from the interface layer so they power multiple surfaces
key_metrics:
- ~35 integrations organized into skills
lessons_learned:
- Separate reusable capabilities (tools/skills/memory) from the interface layer; prompt size drops while capability
  is preserved
- 'Model memory explicitly: conversation context, persistent facts, RAG, and live state have different lifecycles'
- Gate customer-impacting actions behind human approvals rather than trusting the model
