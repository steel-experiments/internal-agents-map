  identity: dedicated-agent
  evidence_strength: detailed-primary
summary: A native agent that synthesizes workspace context, scopes customer feedback into issues, creates follow-up
  work, runs coding sessions, and can be triggered automatically when issues enter triage; used by Linear's own
  CX, Product, and Engineering teams.
architecture:
  sandbox: unknown
  harness: Separate planning agent (triage/issue creation) and coding agent (code generation); Code Intelligence
    for codebase knowledge; scheduled/event-driven 'Loops'
  model: Codex was used for internal pull-request review; other model choices are not detailed in the preserved
    sources
  interfaces:
  - slack
  - intercom
  - linear
  - github
  tool_access: Triage Intelligence (auto-route, dedup, label); GitHub; testing Code Intelligence + custom MCP servers
  knowledge: Semantic/vector search evolved into agentic context acquisition across the workspace; Datadog/Sentry
    customer context
  context_mgmt: System skills are progressively disclosed per run; relevant skills load before the task and the
    agent loads further skills on demand
  credentials: The Agent SDK gives agents explicit identities, scoped OAuth tokens, assignable/mentionable handles,
    and visible human delegation; issues stay assigned to a human; 'an agent cannot be held accountable'
primitives:
- name: Triage Intelligence
  desc: Auto-routes issues, flags duplicates, suggests labels
- name: Agent SDK identities
  desc: Agents get identities, scoped team access, and visible delegation alongside humans
- name: Loops
  desc: Scheduled or event-driven agent runs that execute recurring work
- {name: Scope customer feedback into an issue, desc: 'From the Intercom inbox, the agent picks up the full
    conversation, metadata, and attachments, and creates a scoped issue'}
- {name: Take a first pass at the coding work, desc: 'A delegated coding agent drafts the change or opens the pull
    request while the issue stays assigned to the human engineer'}
- {name: Review the pull request, desc: 'A coding agent reviews every pull request and a human engineer makes the
    final approval'}
- {name: Pause for confirmation on risky actions, desc: 'When an action is risky or hard to undo, the agent pauses
    mid-run and asks the user for confirmation'}
- {name: Close the loop with the customer, desc: 'When the issue is done, related requests reopen in Intercom or the
    originating Slack thread is notified, and a person follows up with the customer'}
lessons_learned:
- Linear's customer-support workflow carries Intercom conversations into issues and delegates coding work from
  those issues.
- Linear recommends starting with agent suggestions, observing the results, and adding guidance before enabling
  automatic operation.
- One Linear engineer reports better results when he breaks coding work into small, targeted steps.
- A Linear engineer finds agent mistakes useful for identifying possible failure modes during his review.
- Linear completion events notify the originating support workflow, where a person follows up with the customer.
