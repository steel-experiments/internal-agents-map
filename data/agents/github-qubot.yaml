architecture:
  model: Powered by GitHub Copilot
  harness: Copilot Cloud Agent running on github.com
  tool_access: Queries GitHub's data warehouse
  interfaces: [slack, cli]
  knowledge: Federated context contributed by teams and normalized into a structured context layer
  context_mgmt: A context agent ingests, organizes, and normalizes contributed context
primitives:
- {name: Start a Qubot run, desc: A question in the Qubot Slack channel spawns a Copilot Cloud Agent instance on github.com}
- {name: Select context and query engine, desc: "The run uses the federated context layer and routes work to Kusto for recent exploratory data or Trino for complex historical analysis"}
- {name: Query the warehouse, desc: Qubot connects to Kusto and Trino through MCP servers and executes the data query}
- {name: Return answer and report, desc: The answer appears in Slack for threaded refinement and the results are stored as a Markdown report in a pull request}
- {name: Offline evaluation gate, desc: "Context and agent-configuration changes run against curated prompts, ground-truth SQL, accuracy, latency, and regression checks before shipping"}
key_metrics:
- Hundreds of users run thousands of queries
- Volume of data questions in internal data and analytics Slack channels dropped
