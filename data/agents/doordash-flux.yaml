claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The platform spans several workflows; the cited engineering examples retain human review
      of agent output.
    valid_at: '2025-11-11'
  lessons_learned.0:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The Flux retrospective lists the initial workflow and later uses; the sequence alone does
      not prove that this rollout order caused adoption.
  lessons_learned.1:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The authors describe the visibility change and its observed adoption pattern, without a controlled
      comparison of channel choices.
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The retrospective names these activities and the work they supported, rather than reporting
      that a playbook library appeared automatically.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The architecture article distinguishes these deployment stages. Its swarm discussion identifies
      governance and explainability as unresolved work.
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The validation sections distinguish query checks from LLM-as-judge and DeepEval assessments;
      a valid query is not proof of a correct business answer.
  lessons_learned.5:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The provenance discussion names these records as the audit trail; recording them does not
      itself establish that the answer is correct.
  headline_metric:
    metric_scope: Engineering tasks automated in one reported month; calendar measurement month unspecified
    valid_at: '2026-08-11'
    confidence_reason: Dated August 11, 2026 report of a one-month count; this is the observation date, not the
      measurement window.
  key_metrics.0:
    metric_scope: Engineering tasks automated in one reported month; calendar measurement month unspecified
    valid_at: '2026-08-11'
    confidence_reason: Dated August 11, 2026 report of a one-month count; this is the observation date, not the
      measurement window.
  key_metrics.1:
    metric_scope: Weekly automated code reviews powered by Flux
    valid_at: '2026-08-11'
    confidence_reason: Dated August 11, 2026 report; weekly measurement boundaries are not supplied.
  key_metrics.2:
    metric_scope: Unique playbooks and weekly invocations on Flux
