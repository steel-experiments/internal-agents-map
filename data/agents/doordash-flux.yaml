      note: There is no single platform-wide agent review boundary. Scoped downstream operating-model claims remain
        in research details; access controls are described separately.
    implementation:
      state: reported
      claim_paths:
      - architecture.harness
      - architecture.sandbox
      - architecture.tool_access
      - architecture.knowledge
      - architecture.credentials
      - architecture.context_mgmt
      - architecture.interfaces
    validation:
      state: reported
      claim_paths:
      - primitives.5
      - lessons_learned.4
      note: The analytics platform validates generated SQL with linting, EXPLAIN checks, and statistical-metadata
        checks with autocorrection, plus a separate LLM-as-judge and DeepEval framework. Flux playbooks package
        validation per playbook.
    observations:
      state: reported
      claim_paths:
      - headline_metric
      - key_metrics.0
      - key_metrics.1
      - key_metrics.2
    lessons:
      state: reported
      claim_paths:
      - lessons_learned.0
      - lessons_learned.1
      - lessons_learned.2
      - lessons_learned.3
      - lessons_learned.4
      - lessons_learned.5
  implementation_fields:
    model:
      state: unreported
      claim_paths: []
      note: No model or provider is named for either platform. The modular-primitives design claim stays in research
        details.
    harness:
      state: reported
      claim_paths:
      - architecture.harness
      note: The maturity model is the analytics platform's progression. Flux supports multiple coding agent harnesses
        inside its sandboxes.
    sandbox:
      state: reported
      claim_paths:
      - architecture.sandbox
      note: Firecracker microVMs with a sub-five-second p95 end-to-end setup objective; a Flux capability.
    tool_access:
      state: reported
      claim_paths:
      - architecture.tool_access
      note: Flux Agent Gateway with playbook-scoped logged permissions; LangGraph orchestration and prospective
        A2A on the analytics platform.
    knowledge:
      state: reported
      claim_paths:
      - architecture.knowledge
    context_mgmt:
      state: reported
      claim_paths:
      - architecture.context_mgmt
      note: Hybrid retrieval and schema-aware SQL generation; an analytics-platform capability.
    credentials:
      state: reported
      claim_paths:
      - architecture.credentials
      note: Scoped per playbook and brokered through the gateway rather than the laptop; a Flux capability with
        provenance on every action.
    interfaces:
      state: reported
      claim_paths:
      - architecture.interfaces
      note: Flux invocation surfaces are Slack, GitHub, cron, CLI, and skill; the analytics platform adds Cursor.
        The analytics conversational web UI is not claimed.
