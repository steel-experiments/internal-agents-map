id: brex-agent-platform
company: Brex
agent_name: Internal Agent Platform
approach_type: platform
deployment_stage: scaled
year: 2025
first_public_evidence:
  date: '2025-09-25'
  source_id: brex-agent-platform-source-1
last_reviewed_at: '2026-09-16'
status: internal
domains:
- finance-ops
- support
- customer-success
autonomy: human-in-loop
operating_models:
- scope: high-confidence operations case (support first touch, fraud recommendation) → automated completion; low-confidence
    remainder → analyst review
  attention_boundary: exception-only
- scope: KYC application → completed verification steps
  attention_boundary: work-product-review
- scope: collections follow-up interaction → drafted response options the servicing team selects, customizes, or
    sends
  attention_boundary: work-product-review
rubric:
  invocation:
  - interactive
  - event-driven
  state: unknown
  identity: unknown
  evidence_strength: secondary-only
summary: Brex built a Retool-based platform where operations staff build, test and deploy agents for KYC, disputes,
  quality assurance and collections. Its systems engineering team maintains the builder; human involvement differs
  by workflow.
headline_metric: 'Dispute-agent use example: Dispute processing time fell from three hours to three seconds'
architecture:
  sandbox: Retool-hosted runtime (no bespoke execution env described)
  harness: Retool-based builder with prompt management and multi-model testing/evaluation; built by a ~25-person
    systems-engineering team
  model: Not documented for deployed agents; the platform provides multi-model testing and evaluation at build time
  interfaces:
  - slack
  - internal-ui
  tool_access: An MCP server exposes product capabilities to internal agents. Separately, Slack /c1 requests access
    to AI tools through ConductorOne; it is not evidence of invoking an operations agent.
  knowledge: Standard operating procedures uploaded as a knowledge base, such as 100-page dispute guides; customer
    account data
  credentials: SSO via internal Retool proxies (no per-user accounts); ConductorOne access management; Okta auth;
    data classified by risk; ≤30-day retention, no training on inputs
primitives:
- name: Prompt + eval studio
  desc: Non-technical ops staff design prompts, test across models, deploy with QA oversight
- name: MCP tool bridge
  desc: Product features exposed to internal agents through one MCP server
- name: Prepare the dispute submission
  desc: The dispute agent applies the 100+ page dispute guide and the BPO operating procedure to produce a more
    robust, better-articulated submission
- name: Draft the collections response
  desc: The agent analyzes the customer reply and layers in account context and negotiating guidelines, offering
    the servicing team drafts in several tones to select, customize, or send
- name: Apply the quality rubric
  desc: A QA agent reviews every support interaction against the quality rubric and feeds response trends into a
    closed loop improving agent and human performance
key_metrics:
- 50%+ of customer-support cases resolved by chatbot as first touch
- 'Dispute processing: 3 hours → 3 seconds'
- QA covers every support interaction; one person using AI instead of five QA specialists
- KYC adverse-media accuracy 85% → 88%
lessons_learned:
- Brex's CTO recommends automating a useful portion of a workflow before pursuing complete automation.
- Brex assigns a systems engineering team to maintain its internal agent platform and shares capabilities with the
  customer product.
- Brex automates high-confidence fraud cases and sends the remaining cases to analysts with AI-generated findings.
- Brex operations staff and engineers translated KYC procedures into individual decisions and instructions, retaining
  human quality checks.
- Brex groups legal approvals by data retention, training use, and segregation requirements, with controls agreed
  by product and legal teams.
