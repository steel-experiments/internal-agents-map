claim_metadata:
  operating_models.0:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The report documents confidence-threshold automation for fraud recommendations and describes
      L1 process work as fully automated in most cases, with the remainder reviewed by an analyst.
    valid_at: '2025-09-25'
  operating_models.1:
    kind: inference
    provenance: catalog-judgment
    confidence: low
    confidence_reason: The report documents human checks inside the KYC flow and humans reviewing LLM work, but
      a later passage shifts humans toward reviewing trends, so the per-run boundary is mixed in the evidence.
    valid_at: '2025-09-25'
  operating_models.2:
    kind: inference
    provenance: catalog-judgment
    confidence: medium
    confidence_reason: The report documents the servicing team picking among agent-drafted response options before
      anything is sent; initial outreach itself is automated.
    valid_at: '2025-09-25'
  headline_metric:
    valid_at: '2025'
    metric_scope: Dispute-submission preparation using the internal agent platform; not end-to-end chargeback resolution
  key_metrics.0:
    valid_at: '2025'
    metric_scope: Customer-support cases resolved by the chatbot at first touch (Brex customer-facing product AI,
      adjacent to this internal platform)
    denominator: Customer-support cases; exact sample size not provided
  key_metrics.1:
    valid_at: '2025'
    metric_scope: Dispute-submission preparation using the internal agent platform; not end-to-end chargeback resolution
  key_metrics.2:
    valid_at: '2025'
    metric_scope: Quality assurance of customer-support interactions
    denominator: Every support interaction
    measurement_method: Agent applies the quality rubric to every response; one person oversees instead of five
      QA specialists
  key_metrics.3:
    valid_at: '2025'
    metric_scope: KYC adverse-media classification; human versus agent accuracy
  lessons_learned.0:
    kind: opinion
    provenance: reported
    confidence: medium
    confidence_reason: The interview contrasts a 40% target with 100% and describes fraud cases still routed to
      analysts. These are the CTO's priorities, not measured optimal targets.
  lessons_learned.1:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The interview identifies the platform team and explains how new external MCP tools become
      available internally.
  lessons_learned.2:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The fraud example names the automation boundary. It does not establish that all complete
      automation fails on accuracy.
  lessons_learned.3:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The interview describes a joint, line-by-line review of operating procedures and subsequent
      human review of LLM work.
  lessons_learned.4:
    kind: fact
    provenance: reported
    confidence: medium
    confidence_reason: The approval tracks and defined controls are described in the interview; vendor identity
      alone is not the stated basis for those tracks.
