  questions:
    purpose:
      state: reported
      claim_paths:
      - summary
    workflow:
      state: reported
      claim_paths:
      - primitives.2
      - primitives.3
      note: The prompt studio and the MCP bridge are build-time mechanisms. Platform-wide capability and the L1/L2/L3
        restructure stay out of the run description.
    human_involvement:
      state: not-applicable
      claim_paths: []
      note: There is no single platform-wide agent review boundary. Scoped downstream operating-model claims remain
        in research details; access controls are described separately.
    implementation:
      state: reported
      claim_paths:
      - architecture.harness
      - architecture.sandbox
      - architecture.tool_access
      - architecture.knowledge
      - architecture.credentials
      - architecture.interfaces
    validation:
      state: reported
      claim_paths:
      - primitives.4
      note: The quality-rubric agent checks every support interaction; the KYC human checks are cited with human
        involvement.
    observations:
      state: reported
      claim_paths:
      - headline_metric
      - key_metrics.0
      - key_metrics.1
      - key_metrics.2
      - key_metrics.3
    lessons:
      state: reported
      claim_paths:
      - lessons_learned.0
      - lessons_learned.1
      - lessons_learned.2
      - lessons_learned.3
      - lessons_learned.4
  implementation_fields:
    model:
      state: unreported
      claim_paths: []
      note: Deployed-agent models are not documented; multi-model testing is build time. The placeholder claim stays
        in research details.
    harness:
      state: reported
      claim_paths:
      - architecture.harness
    sandbox:
      state: reported
      claim_paths:
      - architecture.sandbox
      note: Retool hosts the runtime; the capture describes no further isolation boundary.
    tool_access:
      state: reported
      claim_paths:
      - architecture.tool_access
      note: The MCP bridge and immediate internal availability are supported at line 40; the Slack /c1 clause describes
        provisioning configuration, not agent invocation (flagged).
    knowledge:
      state: reported
      claim_paths:
      - architecture.knowledge
    context_mgmt:
      state: unreported
      claim_paths: []
      note: No mechanism for maintaining agent context over time is documented; the QA feedback loop improves performance
        rather than managing context.
    credentials:
      state: reported
      claim_paths:
      - architecture.credentials
      note: SSO via Retool proxies, Okta provisioning, and the retention and segregation controls are supported
        at lines 60–62; the ConductorOne vendor name is not in the capture (flagged).
