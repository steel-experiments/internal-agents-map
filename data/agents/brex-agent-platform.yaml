last_reviewed_at: '2026-09-09'
status: internal
domains:
- finance-ops
- support
- customer-success
autonomy: human-in-loop
operating_models:
- scope: internal operations request → completed operation
  attention_boundary: continuous-steering
rubric:
  invocation:
  - interactive
  state: unknown
  identity: unknown
  evidence_strength: secondary-only
summary: Retool-based internal platform where employees build, test, and deploy agents for KYC, disputes, QA, collections,
  and operations.
headline_metric: Dispute processing time fell from three hours to three seconds
architecture:
  sandbox: Retool-hosted runtime (no bespoke execution env described)
  harness: Retool-based builder with prompt management and multi-model testing/evaluation; built by a ~25-person
    systems-engineering team
  model: Multi-model
  interfaces:
  - slack
  - internal-ui
  tool_access: An MCP server exposes external product features to the internal platform; new product tools become
    internally available immediately; invoked via Slack /c1
  knowledge: Standard operating procedures uploaded as a knowledge base, such as 100-page dispute guides; customer
    account data
  credentials: SSO via internal Retool proxies (no per-user accounts); ConductorOne access management; Okta auth;
    data classified by risk; ≤30-day retention, no training on inputs
primitives:
- name: Prompt + eval studio
  desc: Non-technical ops staff design prompts, test across models, deploy with QA oversight
- name: MCP tool bridge
  desc: Product features exposed to internal agents through one MCP server
key_metrics:
- 50%+ of customer-support cases resolved by chatbot as first touch
- 'Dispute processing: 3 hours → 3 seconds'
- QA covers every support interaction; one person using AI instead of five QA specialists
- KYC adverse-media accuracy 85% → 88%
lessons_learned:
- Target 40% automation, not 100%; the last mile drives investments that often yield zero value
- Brex reports that it manages the internal platform with practices used for an external product
- Don't skip the human in the middle; end-to-end automation fails on accuracy
- Map workflows to the discrete steps a human would take, then translate each to LLM instructions
- Architecture beats vendor; legal/data approvals should follow data-handling characteristics, not the tool name
