    confidence: medium
    confidence_reason: "The organization reported this metric without an independent review."
    valid_at: "2026-08"
    reported_by: Company
    metric_scope: "The work measured by this metric"
    denominator: "The relevant total, when available"
    measurement_method: "The reported collection method, when available"

